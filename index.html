<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Painel de Demandas — Kingposto</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d1b2a;
    --bg-deep:#081320;
    --surface:#132842;
    --surface-2:#0f2038;
    --line: #23415f;
    --text:#eef3f8;
    --text-dim:#9db2c7;
    --amber:#f2a93b;
    --amber-dim:#7a5a24;
    --suporte:#e1553a;
    --implantacao:#3fbfb0;
    --baixa:#4caf7d;
    --media:#f2c14e;
    --importante:#f2913b;
    --urgente:#e14e4e;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 15% -10%, rgba(242,169,59,0.08), transparent 60%),
      radial-gradient(900px 500px at 100% 0%, rgba(63,191,176,0.06), transparent 60%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', sans-serif;
    min-height:100vh;
  }

  /* ===== HEADER / SIGNAGE ===== */
  .signage{
    background:linear-gradient(180deg, var(--bg-deep), var(--bg));
    border-bottom:1px solid var(--line);
    padding:28px clamp(16px,4vw,48px) 0;
  }
  .signage-top{
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px; flex-wrap:wrap;
    padding-bottom:20px;
  }
  .brand-eyebrow{
    font-family:'JetBrains Mono', monospace;
    font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber); margin:0 0 6px;
  }
  .brand-title{
    font-family:'Oswald', sans-serif;
    font-weight:700; text-transform:uppercase; letter-spacing:.03em;
    font-size:clamp(24px,3.4vw,38px);
    margin:0; color:var(--text);
    display:flex; align-items:center; gap:14px;
  }
  .pump-mark{
    width:38px;height:38px;flex:none;
  }
  .brand-sub{
    color:var(--text-dim); font-size:13.5px; margin:6px 0 0; max-width:520px; line-height:1.5;
  }
  .totals{
    display:flex; gap:10px; font-family:'JetBrains Mono', monospace;
  }
  .total-chip{
    background:var(--surface); border:1px solid var(--line); border-radius:8px;
    padding:10px 16px; text-align:center; min-width:88px;
  }
  .total-chip .n{ display:block; font-size:22px; font-weight:600; color:var(--amber); }
  .total-chip .l{ display:block; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim); margin-top:2px;}

  /* ===== TABS as pump selector ===== */
  .tabs{
    display:flex; gap:6px; padding-top:4px;
  }
  .tab-btn{
    appearance:none; border:1px solid var(--line); border-bottom:none;
    background:var(--surface-2); color:var(--text-dim);
    font-family:'Oswald', sans-serif; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    font-size:15px; padding:12px 26px; border-radius:10px 10px 0 0;
    cursor:pointer; display:flex; align-items:center; gap:10px;
    transition:background .15s, color .15s;
    position:relative; top:1px;
  }
  .tab-btn .dot{width:9px;height:9px;border-radius:50%;background:var(--text-dim);}
  .tab-btn.active{ background:var(--bg); color:var(--text); }
  .tab-btn[data-tab="suporte"].active .dot{background:var(--suporte); box-shadow:0 0 8px var(--suporte);}
  .tab-btn[data-tab="implantacao"].active .dot{background:var(--implantacao); box-shadow:0 0 8px var(--implantacao);}
  .tab-btn .count{
    font-family:'JetBrains Mono', monospace; font-size:12px; background:rgba(255,255,255,.06);
    padding:2px 8px; border-radius:20px;
  }

  /* ===== MAIN ===== */
  main{
    background:var(--bg); border-top:1px solid var(--line);
    padding:22px clamp(16px,4vw,48px) 60px;
  }
  .toolbar{
    display:flex; gap:12px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
  }
  .search-wrap{ position:relative; flex:1; min-width:240px; max-width:420px; }
  .search-wrap input{
    width:100%; background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:10px 14px 10px 34px; border-radius:8px; font-size:14px; font-family:'Inter',sans-serif;
  }
  .search-wrap input:focus{ outline:2px solid var(--amber); outline-offset:1px; }
  .search-wrap svg{ position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.5; }

  select{
    background:var(--surface); border:1px solid var(--line); color:var(--text);
    padding:10px 12px; border-radius:8px; font-size:13.5px; font-family:'Inter',sans-serif; cursor:pointer;
  }
  select:focus{ outline:2px solid var(--amber); }

  .legend{
    display:flex; gap:14px; margin-left:auto; font-size:12px; color:var(--text-dim); flex-wrap:wrap;
  }
  .legend span{ display:inline-flex; align-items:center; gap:6px; }
  .legend i{ width:10px;height:10px;border-radius:2px; display:inline-block; }

  /* ===== GROUP HEADERS ===== */
  .group-head{
    font-family:'JetBrains Mono', monospace; font-size:11.5px; letter-spacing:.12em;
    color:var(--amber); text-transform:uppercase; margin:26px 0 10px; padding-bottom:6px;
    border-bottom:1px dashed var(--line); display:flex; align-items:center; gap:8px;
  }
  .group-head .count{ color:var(--text-dim); font-weight:400; }

  /* ===== CARD ROW ===== */
  .card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:14px 16px; margin-bottom:8px; display:grid;
    grid-template-columns:26px 1fr auto; gap:14px; align-items:start;
    transition:border-color .15s, background .15s;
  }
  .card:hover{ border-color:var(--amber-dim); background:var(--surface-2); }
  .gauge-wrap{ padding-top:3px; }
  .gauge{ width:22px; height:52px; border-radius:5px; background:rgba(255,255,255,.05); border:1px solid var(--line); position:relative; overflow:hidden; }
  .gauge .fill{ position:absolute; bottom:0; left:0; right:0; border-radius:0 0 4px 4px; }
  .gauge-label{ font-family:'JetBrains Mono',monospace; font-size:8.5px; text-align:center; color:var(--text-dim); margin-top:3px; letter-spacing:.03em;}

  .card-main .title{ font-size:14.5px; font-weight:600; color:var(--text); line-height:1.4; margin:0 0 6px; }
  .card-main .title .tag{ color:var(--amber); font-weight:700; }
  .meta-row{ display:flex; flex-wrap:wrap; gap:8px 14px; font-size:12px; color:var(--text-dim); }
  .meta-row .m-item{ display:flex; align-items:center; gap:5px; }
  .meta-row svg{ opacity:.6; }
  .badge{
    font-family:'JetBrains Mono', monospace; font-size:10.5px; padding:2px 8px; border-radius:20px;
    text-transform:uppercase; letter-spacing:.04em; border:1px solid transparent;
  }
  .badge.cat-suporte{ background:rgba(225,85,58,.12); color:var(--suporte); border-color:rgba(225,85,58,.3); }
  .badge.cat-implantacao{ background:rgba(63,191,176,.12); color:var(--implantacao); border-color:rgba(63,191,176,.3); }
  .badge.status{ background:rgba(255,255,255,.06); color:var(--text-dim); }
  .badge.status.andamento{ color:#8fd6c8; background:rgba(63,191,176,.1); }

  .notes-toggle{
    background:none; border:none; color:var(--text-dim); font-size:12px; cursor:pointer;
    text-decoration:underline; text-underline-offset:2px; padding:0; margin-top:6px; font-family:'Inter',sans-serif;
  }
  .notes-toggle:hover{ color:var(--amber); }
  .notes-body{
    display:none; margin-top:8px; font-size:12.5px; color:var(--text-dim); background:var(--bg-deep);
    border:1px solid var(--line); border-radius:8px; padding:10px 12px; white-space:pre-wrap; line-height:1.5;
    max-height:220px; overflow:auto;
  }
  .notes-body.open{ display:block; }

  .side-col{ text-align:right; display:flex; flex-direction:column; align-items:flex-end; gap:6px; min-width:150px; }
  .assignee{ font-size:12.5px; color:var(--text); font-weight:500; }
  .assignee .lbl{ display:block; font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.06em; margin-bottom:2px; font-family:'JetBrains Mono',monospace;}

  .empty-state{ text-align:center; padding:60px 20px; color:var(--text-dim); }

  ::-webkit-scrollbar{ width:10px; height:10px; }
  ::-webkit-scrollbar-track{ background:var(--bg-deep); }
  ::-webkit-scrollbar-thumb{ background:var(--surface-2); border-radius:6px; border:1px solid var(--line); }

  @media (max-width:640px){
    .card{ grid-template-columns:22px 1fr; }
    .side-col{ grid-column:1/-1; flex-direction:row; align-items:center; justify-content:space-between; text-align:left; margin-top:8px; padding-top:8px; border-top:1px solid var(--line); }
  }
</style>
</head>
<body>

<div class="signage">
  <div class="signage-top">
    <div>
      <p class="brand-eyebrow">Kingposto · Duofy</p>
      <h1 class="brand-title">
        <svg class="pump-mark" viewBox="0 0 48 48" fill="none">
          <rect x="8" y="10" width="22" height="32" rx="2" stroke="#f2a93b" stroke-width="2.5"/>
          <rect x="12" y="15" width="14" height="10" rx="1" stroke="#f2a93b" stroke-width="2"/>
          <circle cx="15" cy="30" r="1.6" fill="#f2a93b"/>
          <circle cx="23" cy="30" r="1.6" fill="#f2a93b"/>
          <path d="M30 18h6a3 3 0 0 1 3 3v14a2.5 2.5 0 0 0 5 0V16" stroke="#f2a93b" stroke-width="2.5" stroke-linecap="round"/>
        </svg>
        Painel de Demandas
      </h1>
      <p class="brand-sub">Itens do backlog Planner, separados por natureza. Concluídos já retirados de circulação — o que resta aqui é o que ainda precisa rodar.</p>
    </div>
    <div class="totals">
      <div class="total-chip"><span class="n" id="totalAll">–</span><span class="l">Ativos</span></div>
      <div class="total-chip"><span class="n" id="totalUrgente">–</span><span class="l">Urgentes</span></div>
      <div class="total-chip"><span class="n" id="totalAndamento">–</span><span class="l">Em curso</span></div>
    </div>
  </div>
  <div class="tabs">
    <button class="tab-btn active" data-tab="suporte"><span class="dot"></span>Suporte<span class="count" id="cnt-suporte">0</span></button>
    <button class="tab-btn" data-tab="implantacao"><span class="dot"></span>Implantação<span class="count" id="cnt-implantacao">0</span></button>
  </div>
</div>

<main>
  <div class="toolbar">
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#9db2c7" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      <input type="text" id="searchInput" placeholder="Buscar por nome, cliente, atribuído...">
    </div>
    <select id="prioridadeFilter">
      <option value="">Todas prioridades</option>
      <option value="Urgente">Urgente</option>
      <option value="Importante">Importante</option>
      <option value="Média">Média</option>
      <option value="Baixa">Baixa</option>
    </select>
    <select id="categoriaFilter">
      <option value="">Todas categorias</option>
    </select>
    <select id="responsavelFilter">
      <option value="">Todos responsáveis</option>
    </select>
    <div class="legend">
      <span><i style="background:var(--urgente)"></i>Urgente</span>
      <span><i style="background:var(--importante)"></i>Importante</span>
      <span><i style="background:var(--media)"></i>Média</span>
      <span><i style="background:var(--baixa)"></i>Baixa</span>
    </div>
  </div>

  <div id="listContainer"></div>
</main>

<script>
const DATA = {"suporte": [{"nome": "[API-FROTA] Solicitação de melhoria – Identificação de CNPJ/Cliente via API na transação TEF", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000186\nEstamos solicitando a análise e implementação de melhorias nas APIs de integração do TEF, especificamente para a bandeira eFleet, com foco na identificação do CNPJ e/ou cliente no momento da transação do cartão frota.\nAtualmente, a ausência ou limitação dessa identificação na ponta da venda gera impactos diretos nos processos internos de faturamento, financeiro e diretoria, principalmente nos seguintes cenários:\nDivergência de cliente ou CNPJ vinculado à transação\nDivergência de preço praticado na venda\nNecessidade de ajustes posteriores no faturamento\nProcessos de troca, estorno ou devolução excessivamente morosos e desnecessários\nQuando um problema ocorre no momento da venda e não é corretamente validado ou identificado, o mesmo erro se propaga até a etapa de faturamento e recebimento, gerando retrabalho operacional, impacto financeiro e desgaste com o cliente.Objetivo da Solicitação\nGarantir que, no momento da transação TEF, seja possível:\nIdentificar corretamente o CNPJ e/ou cliente associado ao cartão frota eFleet\nValidar essas informações em tempo real via API\nAssegurar que a venda seja concluída somente se os dados estiverem corretos, evitando correções posteriores\nEssa melhoria visa assegurar a conformidade da venda na origem, reduzindo significativamente problemas operacionais, financeiros e comerciais.Contexto e Prioridade\nEsta solicitação é uma demanda direta da Diretoria, com envolvimento ativo das áreas Financeira e de Faturamento, devido ao impacto recorrente observado nos processos atuais.\nA correta validação na ponta é fundamental para garantir:\nIntegridade das informações comerciais\nAgilidade no faturamento\nRedução de retrabalho e exceções operacionaisDocumentação\nA documentação técnica da bandeira eFleet encontra-se anexa a este chamado para apoio na análise e implementação da melhoria solicitada.", "atrasado": "false"}, {"nome": "[Coopel] Emissão de NFe para Consumo Próprio", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Na Coopel eles irão realizar a emissão das vendas para os outros CNPJs do grupo com o CFOP 5659 e a natureza da operação TRANSF. COMBUSTIVEL/LUBRIFICANTE ADIQ/R.\nConseguimos emitir uma nota pelo King com essa mesma natureza de operação e CFOP para o DIESEL, mas quando tentamos emitir para GASOLINA está rejeitando.\nSe for CFOP de transferência e for combustível ou lubrificante, tem que preencher o transportador.\nEstou anexando no chamado o XML da NF que eles emitiram e o PDF, também estou anexando a NF 332 que emitimos pelo King com o DIESEL B S500(Autorizada).", "atrasado": "false"}, {"nome": "[COOPEL] Matrícula e Loja do Cliente na impressão do DANFE", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "202606001407\nColocar Matrícula e Loja do Cliente na impressão do DANFE (NFe)\nDescrição padrão\nOrigem:\nSuporte\nSolicitante:\nCOOPEL\nTipo:\nMelhoria\nContexto:\nFavor colocar a matrícula e loja do associado na impressão do danfe\nProblema identificado:\n. Faz toda diferença pra conferência e organização dos envelopes de fechamento mensal dos associados.\nImpacto:\nMelhora no fechamento mensal\nUrgência:\nMelhoria sem urgencia\nAnexos / evidências:\nTicket  e exemplo em anexo\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "[COOPEL] Ordem das negociações de pagamento em tela", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Necessitamos que as negociações de pagamento, ao escolher a opção “nota prazo”, que respeite o filtro Descrição e não código da condição de pagamento. Como não conseguimos uma ordem via código, é de extrema importância que, para o operador, pois facilita demais a escolha correta e a agilidade no ato da venda. \nE com a entrada do supermercado em produção no mês que vem será de extrema importância que isso esteja pronto antes.", "atrasado": "false"}, {"nome": "[Coopel] Relatório Vendas Por Veículo/Placa", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000258\nIncluir filtros no relatório TRET023 (Cliente De - Até / Placa De - Até) para que possamos imprimir todas as vendas de um determinado cliente com toda sua frota (totalizado por placa e total geral).", "atrasado": "false"}, {"nome": "[COOPEL][ Ordem das negociações de pagamento em tela", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Necessitamos que as negociações de pagamento, ao escolher a opção “nota prazo”, que respeite o filtro Descrição e não código da condição de pagamento. Como não conseguimos uma ordem via código, é de extrema importância que, para o operador, pois facilita demais a escolha correta e a agilidade no ato da venda.\nE com a entrada do supermercado em produção no mês que vem será de extrema importância que isso esteja pronto antes.", "atrasado": "false"}, {"nome": "[COOPERMOTA] Problema Integração de Sangrias", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Falha na integração de sangrias realizadas no PDV quando possuem a mesma DATA + HORA + MINUTO e também o mesmo valor.\nExemplo identificado extraído da tabela cash-control:\n2026-05-04 19:51:13.601 | 001 | 3000.00 | Cash Out\n2026-05-04 19:51:25.254 | 001 | 2700.00 | Cash Out\n2026-05-04 19:51:40.661 | 001 | 3000.00 | Cash Out\nNo cenário acima, foram realizadas 3 sangrias na mesma data/hora/minuto. A diferença entre elas está apenas nos segundos.\nNa integração do caixa, apenas as duas primeiras sangrias foram processadas. A última sangria, no valor de R$ 3.000,00, é gerado o JSON de integração para UK2 mas ele preenche o status como I ignorando o registro.", "atrasado": "false"}, {"nome": "[COOPRATA] Atualização/compatibilização do rdmake LOJRNFCE.prw", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Suporte", "notas": "A Cooprata está com problemas para imprimir os cupons fiscais na rotina de Funções NFe NFCe, após análise descobrimos que o fonte que está impactando pra eles é o rdmake da automação comercial LOJRNFCE.prw, que eles utilizam no protheus para o Mercado.\nEm anexo segue o rdmake atualizado no portal da TOTVS para compatibilizarmos com o nosso que está desatualizado.", "atrasado": "false"}, {"nome": "[COOPRATA] Notas de transferência não estão gerando IBS/CBS", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Edgar Araújo Neto;Leonardo José Pereira de Ávila", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Suporte", "notas": "A Cooprata juntamente ao departamento Fiscal reportou que as notas de Transferência precisa gerar as tags de IBS/CBS na nota, pelo que analisei eles estão utilizando o CST do IBS e CBS 410 que é \"Operações Não Onerosas: O CST 410 agrupa operações sem cobrança (contraprestação), como remessas para conserto, brindes e doações, onde não há incidência de IBS/CBS, exceto por exceções na legislação.\", além disso estão enviando as aliquotas zeradas.\nEles enviaram um XML de uma nota emitida no Supermercado que gera essas informações mesmo zeradas (anexo).A Cooprata, juntamente com o departamento Fiscal, reportou a necessidade de que as notas de Transferência passem a gerar as tags de IBS/CBS no XML.\nPela análise realizada, essas operações estão utilizando o CST IBS/CBS 410, referente a operações não onerosas. Esse CST contempla operações sem contraprestação, como remessas para conserto, brindes, doações e outras situações em que não há incidência de IBS/CBS, ressalvadas as exceções previstas na legislação.\nAlém disso, as alíquotas estão sendo enviadas zeradas, o que está de acordo com o enquadramento fiscal utilizado.\nComo referência, o cliente encaminhou um XML emitido pelo sistema do Supermercado, no qual as tags de IBS/CBS são geradas mesmo com os valores e alíquotas zerados. O XML foi anexado para análise e comparação do comportamento esperado.\nUB12-10 – Rejeição 1115: IBS/CBS não informado\nhttps://blog.tecnospeed.com.br/nota-tecnica-reforma-tributaria-nfe-nfce/?utm_source=chatgpt.com", "atrasado": "false"}, {"nome": "[DECI] [PROJETO] - Digitalização Cupons Nota a Prazo", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Pensando em melhoria de processos, gostaria de darmos inicio em um projeto para digitalizar/informatizar as assinaturas de nota a prazo, de forma eletrônica, para tornar o faturamento mais rápido e dinâmico, e automatizado. Em uma conversa com o Danilo, expliquei com melhores detalhes. Porém gostaria de combinar para explicar todo o escopo do projeto, e entender valores e prazos para esse desenvolvimento.", "atrasado": "false"}, {"nome": "[DECIIO] Gestão de Cancelas – Ações Remotas e Controle por Alçada - 202606001224", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Necessitamos disponibilizar funcionalidades para gerenciamento remoto das cancelas de entrada e saída.\nObjetivos:\nAbertura remota;\nAbono remoto;\nControle por alçada;\nRegistro obrigatório de justificativa;\nMotivos parametrizáveis.", "atrasado": "false"}, {"nome": "[DECIO]  [NF-e SEFAZ] Descrição de usuário emissor de Nota de Acobertamento", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000187\nEstamos com o intuito de minimizar ao máximo as notas que ficam no Protheus sem transmissão.\nPra isso estamos criando rotinas customizadas de Transmissão e Monitoramento e tentando identificar os operadores que não transmitem ou monitoram as notas pra passar orientações e treinamentos pertinentes.\nPorém, pras notas geradas pelo Gera NF-e e Faturamento Manua V2 a rotina NF-e Sefaz não trás a descrição do usuário e Incluiu e Alterou o documento.", "atrasado": "false"}, {"nome": "[Decio] (API-FROTA) Solicitação de melhoria – Identificação de CNPJ/Cliente via API na transação TEF (Administradora CTF)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000260\nEstamos solicitando a análise e eventual implementação de melhorias nas integrações via API, especificamente para a administradora CTF, com foco na identificação correta do CNPJ e/ou cliente no momento da transação do cartão frota, durante a autorização TEF. \nAtualmente, conforme a documentação disponibilizada pela CTF, as integrações existentes concentram-se em conciliação financeira e consulta de transações já realizadas (pós-venda). A ausência de validações na ponta da venda tem gerado impactos diretos nos processos de Faturamento, Financeiro e Diretoria, especialmente nos seguintes cenários: \nTransações vinculadas acliente ou CNPJ incorreto\nDivergência de preçopraticado em relação às condições contratuais do cliente\nNecessidade deajustes manuais no faturamento\nProcessos detroca, estorno ou devoluçãoexcessivamente morosos e operacionais\nQuando um problema ocorre no momento da venda e não é validado corretamente, o mesmo erro se propaga até o faturamento e o recebimento, gerando retrabalho, riscos financeiros e desgaste operacional. \n \nObjetivo da Solicitação \nViabilizar que, no momento da transação TEF, seja possível: \nIdentificar corretamente ocliente e/ou CNPJ vinculado ao cartão CTF\nValidar essas informaçõesvia API, preferencialmente de forma síncrona\nGarantir que a transação seja concluídasomente quando os dados estiverem corretos, evitando correções posteriores\nO objetivo é assegurar a conformidade da venda na origem, reduzindo exceções operacionais, retrabalho e impactos financeiros. \n \nContexto e Prioridade \nEsta solicitação é uma demanda direta da Diretoria, com acompanhamento das áreas Financeira e de Faturamento, motivada por recorrências operacionais observadas no cenário atual. \nRessaltamos que esta demanda representa uma evolução funcional, atuando antes da conciliação, complementando as APIs atualmente disponibilizadas pela CTF. \n \nConsiderações Finais \nSolicitamos, por gentileza, o retorno quanto à viabilidade técnica, possíveis limitações de integração e eventuais alternativas de implementação para permitir a validação preventiva da venda no momento da autorização TEF.", "atrasado": "false"}, {"nome": "[Decio] - Analise de lentidão de base Rio Verde.", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Suporte", "notas": "Conforme alinhado em call, precisamos avaliar as consultas SQL do log em anexo para melhorar o desempenho do sistema na rede Decio.", "atrasado": "false"}, {"nome": "[Decio] - Correção descrição Operação - Conferência de Caixa", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Movdesk: 202606001536\nCorreção descrição Operação - Conferência de Caixa\nDescrição padrão\nOrigem: Suporte\nSolicitante: Decio\nTipo: Erro\nContexto:\nAo inserir um TrocoPIX na conferência de caixa, a operação que apresentar é \"Vale HaverB\".\n(imagem sobre a situação anexada)\nImpacto:\nGerando divergencia da informação registrada\nUrgência:\nnormal\nResponsável pela análise:\nLucas", "atrasado": "false"}, {"nome": "[Decio] - Ducha no Totem de Auto-Pagamento", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesk: 202607001881\nDucha no Totem de Auto-Pagamento\nDescrição padrão\nOrigem: Suporte\nSolicitante: Decio\nTipo: melhoria\nContexto:\nEles estao inplantando a DuchaEVO nas unidades.Eles querem colocar a possibilidade de geração de banho no Totem de Auto-Pagamento.\nImpacto:\nEssa melhoria proporcionará maior flexibilidade operacional,e melhora a esperiencia do cliente.\nUrgência:\nNormal\nResponsável pela análise:\nLucas", "atrasado": "false"}, {"nome": "[DECIO] - Dúvida sobre parametrização da forma de pagamento nos dados adicionais da NF-e/NFC-e - 202607001738", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Mensagem do cliente: Bom dia! Tudo bem e você?\nAnalisando este caso, verificamos que se trata da emissão da NF-e. No rodapé da nota fiscal deve ser informada a forma de pagamento, conforme demonstrado na imagem abaixo:\nValidando internamente com o time, identificamos que já houve um cenário semelhante anteriormente. Acreditamos que este caso esteja relacionado ao mesmo bug, sendo um bugfix referente a essa funcionalidade.\nA solicitação é semelhante à tratada no seguinte chamado:\nhttps://duofy.atlassian.net/servicedesk/customer/portal/4/POSTO-512\nPoderiam, por gentileza, verificar se este caso está relacionado ao mesmo ajuste ou se será necessária uma nova correção\nDescrição padrão\nOrigem: Suporte\n.\nSolicitante: Paulo Quirino da Silva Neto\n.\nTipo: Funcionalidade / Melhoria\n.\nContexto: O cliente deseja que a forma de pagamento seja destacada nas informações adcionais da NFe\n.\nProblema identificado: Inexistência de uma parametrização que insira automaticamente o descritivo da forma de pagamento (ex: \"DINHEIRO\", \"TICKETLOG\", \"NOTA A PRAZO\") no campo de \"Dados Adicionais\" ou no rodapé da NFe\n.\nImpacto: Necessidade de consultas manuais ao sistema para identificar como a nota foi paga\n.\nUrgência: Média\n.\nAnexos / evidências: Print demonstrativo do rodapé da nota fiscal onde a informação deve ser inserida, conforme solicitado pelo cliente no ticket original\n.\nResponsável pela análise: José Abinoan Araujo Almeida\n.", "atrasado": "false"}, {"nome": "[Decio] - Implementação de reconhecimento automático de cliente via API RAU no ato do pagamento (Ticket Log / Expers)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000270\nFoi aberto um chamado em nossa fila com a solicitação de validação e implantação da API RAU (Recolha Autônoma de Notas Fiscais), com o objetivo de reconhecer automaticamente o cliente pelo cartão no momento da venda, garantindo que o CNPJ utilizado na emissão da NF-e seja exatamente o mesmo CNPJ exigido pelos portais Ticket Log / Expers.\nCom base nas documentações oficiais da Edenred/Ticket Log, a API RAU deve ser utilizada de forma automática no fluxo de pagamento, especialmente em transações TEF, permitindo que, após a autorização da venda, o sistema consulte a API utilizando o código de autorização da transação e retorne os dados fiscais corretos do cliente (CNPJ, razão social, etc.), sem intervenção manual do operador Boas práticas de utilização da ….\nO fluxo esperado é:\nRealização da transação no PDV;\nCaptura automática do código de autorização;\nConsulta automática à API RAU;\nRetorno dos dados do cliente obrigatórios para emissão da NF-e;\nEmissão da NF-e modelo 55, respeitando integralmente os dados retornados pela API;\nEnvio do XML da NF-e à Ticket Log / Expers.\nA documentação reforça que:\nOs dados retornados pela API não podem ser alterados pelo sistema emissor da NF;\nA consulta deve ocorrer sem ação manual do operador, visando ganho operacional e redução de erros;\nPostos Ticket Log e Expers podem possuir códigos de estabelecimento distintos, o que deve ser tratado na integração;\nA API é gratuita, exige apenas credenciais fornecidas pela Edenred e parametrização no sistema PDV Boas práticas de utilização da ….\nAdicionalmente, conforme apresentação institucional da Edenred, a Recolha Autônoma tem como objetivo automatizar totalmente o processo de identificação do cliente e envio das notas fiscais, eliminando a necessidade de consultas manuais em portal e garantindo conformidade fiscal e financeira Apresentação Recolha Autônoma -….\nSolicitação ao fornecedor\nSolicitamos:\nAvaliação técnica da documentação anexada;\nImplementação do reconhecimento automático do cliente pelo cartão, via API RAU, no momento da venda nos PDVs;\nGarantia de que o CNPJ retornado pela API seja utilizado automaticamente na emissão da NF-e, mantendo aderência ao exigido pelos portais Ticket Log e Expers;\nOrientação sobre eventuais ajustes de parametrização necessários no PDV/TEF para captura e armazenamento do código de autorização.\nFicamos no aguardo do retorno técnico para alinhamento do escopo, esforço de desenvolvimento e cronograma de implantação.", "atrasado": "false"}, {"nome": "[DECIO] - Utilizar TrocoPIX de venda cancelada - 202607001734", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Título: Reutilização e Vínculo de TrocoPIX de vendas canceladas na Conferência de Caixa.\nOrigem: Suporte.\nSolicitante: Getúlio da Consolação Pires Filho (Grupo Décio).\nTipo: Melhoria / Funcionalidade.\nContexto: No fluxo operacional atual, quando uma venda com TrocoPIX é cancelada, o título de troco permanece ativo na tabela SE1, pois o valor não retorna automaticamente para a conta do posto. O operador, ao realizar uma nova venda para substituir a anterior, acaba gerando um novo TrocoPIX ou utilizando outra forma de troco, o que gera duplicidade de valores ativos no financeiro.\nProblema identificado: Inexistência de uma funcionalidade ou \"gatilho\" na rotina de Conferência de Caixa que permita ao usuário visualizar títulos de TrocoPIX \"órfãos\" (de vendas canceladas) e vinculá-los a uma nova venda ativa.\nImpacto: Duplicidade de valores na SE1, gerando inconsistência nos relatórios financeiros e na conciliação bancária, além de exigir que a tesouraria realize baixas ou ajustes manuais para \"limpar\" os registros duplicados.\nUrgência: Média\nAnexos: Mensagem do cliente.\nMENSAGEM DO CLIENTE: Getúlio da Consolação Pires Filho\nEstamos com uma necessidade de melhoria referente ao TrocoPIX e valores \"duplicados\".\nExiste o cenário onde é feito uma venda com TrocoPIX, porém por algum motivo é necessário realizar o cancelamento desta venda.\nQuando ocorre o cancelamento, a venda é cancelada e o TrocoPIX permanece ativo na SE1 - o que é o comportamento correto , pois o TrocoPIX realmente não retorna pra conta do Decio.\nPor processo, o operador de caixa entende que não é necessário fazer um novo TrocoPIX, faz-se uma nova venda com outra forma de troco, e via Conferência de Caixa este operador ou a tesouraria faz o lançamento do TrocoPIX na venda que está Ativa.\nPorém, quando ocorre isso, na SE1 ficam valores \"duplicados\", pois, permanece o valor do TrocoPIX da venda cancelada, e também, o TrocoPIX inserido na venda que está ativa, via conferência de caixa.\nSolicitamos a melhoria onde, via Conferência de Caixa seja possível vincular a uma venda, valores de TrocoPIX que estão \"pendentes\", ou seja, que a venda foi cancelada, porém o valor do TrocoPIX permanece ativo.\nEntendo que pra não abranger demais as possibilidades, podemos permitir que apenas TrocoPIX identificados que são daquele determinado turno sejam reconhecidos nos vínculos.", "atrasado": "false"}, {"nome": "[Decio] -(API-RECOLHA AUTÔNOMA) TMPAY", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000255\nSolicitamos a abertura de chamado para análise e orientação referente à disponibilização/configuração da API de recolha autônoma para a administradora TMPAY.\nAtualmente já possuímos integração ativa para envio automático das notas emitidas para o portal das seguintes administradoras:\nTicketlog\nCTF\nTruckPag\nExperss\nDessa forma, precisamos viabilizar o mesmo processo para a TMPAY, especificamente no que se refere ao envio automático das notas fiscais emitidas para o portal da administradora.", "atrasado": "false"}, {"nome": "[Decio] -(FROTA) API de Recolha Autônoma \" ValeCard \"", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "2026-06-02", "data_conclusao": "2026-08-18", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk:202604000727\nSegue documentação em anexo pra desenvolvermos a ferramenta de Recolha Autônoma \"ValeCard\".", "atrasado": "false"}, {"nome": "[Decio] -(FROTA) Envio de preço portal TruckPag", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "2026-08-03", "data_conclusao": "2026-08-14", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202604000725\nFoi solicitado pelo time comercial (ref. ao chamado POSTO-1062) a API de envio de preço para o portal TruckPag (como já temos para CTF, TicketLog e Expers).\nSegue link dos métodos disponíveis pro desenvolvimento:\nhttps://api.hml.truckpag.com.br/storage/docs-integrador/index.html#introduction\nSegue mensagem do pessoal da Truckpag:\nTardeeee, tudo bem???\nConforme solicitado, realizei a criação do Token de acesso da API e vou encaminhar logo abaixo o Token juntamente com a documentação que temos.\nToken: 144|BUExvuKvg32Cd4vilI7557RLi71ofD7hNL1WL1uL\nDocumentação: https://api.hml.truckpag.com.br/storage/docs-integrador/index.html#introduction\nDentro da documentação, a parte da API de preços é na aba Negociacao de Preços > Negociar Preço Combustivel", "atrasado": "false"}, {"nome": "[Decio] -Ajuste de códigos FitCard/Valecard em clisitef.ini / CLSIT - causa de rejeição em “Cartão Combustível", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000272\nPrezados,\nAo validar o comportamento do Kingposto (fixo — arquivo clisitef.ini) e do Kingposto móvel (arquivo CLSIT) identificamos uma divergência no posicionamento dos códigos de retorno das bandeiras de combustível (FitCard e Valecard).\nResumo do problema\nOs códigos das bandeiras FitCard (263) e Valecard (77) estão definidos somente sob a seção [CartaoCombustivel] (e em [Debito] em alguns arquivos), fora da seção [Geral].\nQuando os códigos ficam fora de [Geral], as transações de FitCard/Valecard entram em seleções diferentes na tela de finalização da venda, resultando em fluxo distinto em relação às demais bandeiras de voucher e ocasionando rejeição operacional durante a transação.\nTrechos do arquivo (exemplo atual)\n[Geral]\nTransacoesAdicionaisHabilitadas=7;8;16;26;28;30;37;46;56;57;58;70;71;72;3003;3004;3014;3020;3022;3192;3193;3289;3625;2626;3653;3654;3655;3675;4178\nConexaoObrigatoria=1\nMantemConexaoAtiva=1\nPortaSiTef=4096;5096\n[Debito]\nTexto1=FitCard\nRede1=263\nTexto2=Valecard\nRede2=77\n[CartaoCombustivel]\nTexto1=FitCard\nRede1=263\nTexto2=Valecard\nRede2=77\nComportamento esperado\nOs códigos 77 e 263 devem ser tratados como as demais bandeiras de voucher, seguindo o mesmo fluxo de seleção/finalização.\nPara isso, os códigos precisam constar na lista TransacoesAdicionaisHabilitadas dentro da seção [Geral], de modo que o mecanismo de finalização os inclua na mesma seleção que as demais bandeiras.\nCorreção sugerida (exemplo)\nIncluir 77 e 263 no TransacoesAdicionaisHabilitadas na seção [Geral]. Exemplo (ilustrativo — mantenham ordenação/validação conforme padrão do fornecedor):\n[Geral]\nTransacoesAdicionaisHabilitadas=7;8;16;26;28;30;37;46;56;57;58;70;71;72;3003;3004;3014;3020;3022;3192;3193;3289;3625;2626;3653;3654;3655;3675;4178;77;263\n...\nGarantir que as entradas em [Debito] e [CartaoCombustivel] permaneçam apenas para identificação textual (se necessário), mas não sejam a única fonte do mapeamento lógico que determina a seleção final do voucher.\nFornecer versão corrigida do instalador/patch ou instrução oficial de alteração segura dos arquivos (incluindo backup e rollback).\nImpacto\nRejeição ou fluxo incorreto na finalização de vendas com FitCard/Valecard.\nImpacto operacional em frentes de atendimento e perdas de venda/atendimento no PDV.\nAmbientes afetados: Kingposto fixo (clisitef.ini) e Kingposto móvel (CLSIT) — favor considerar ambos.\nSolicitação\nPor favor, confirmar se a alteração de incluir 77 e 263 em TransacoesAdicionaisHabilitadas é a abordagem correta e segura para produção, ou enviar patch/atualização oficial que corrija o mapeamento para que FitCard/Valecard sigam o mesmo fluxo das demais bandeiras de voucher.\nPrazo de resposta solicitado: o mais breve possível devido ao impacto operacional.\nDa forma que está configurado hoje ao selecionar “ 1: Cartão Combustível” há rejeição, pelo código não estar na [Geral] dos arquivos de configuração. Ao adicionar os códigos do ValeCard e FitCard na guia [Geral] acredito que o fluxo dará OK indo pela opção 1.", "atrasado": "false"}, {"nome": "[Decio] -Composição XML cliente com informação Pedido", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000274\nTemos um cliente específico que possui um controle de pedido e que alega que podemos apoia-lo ref. a composição do XML levar esse número do pedido no campo correto.\nHoje quando informamos os dados vão pro campo de observação.\n \nEm anexo o e-mail de solicitação.", "atrasado": "false"}, {"nome": "[Decio] -Configuração de Emissão de Boletos por Usuário no Faturamento Manual V2", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesck: 202606001553\nConfiguração de Emissão de Boletos por Usuário no Faturamento Manual V2\nDescrição padrão\nOrigem:\nSuporte\nSolicitante:\nDecio\nTipo:\nmelhoria\nContexto:\nAtualmente, no Faturamento Manual V2, a definição do banco para emissão de boletos é realizada por meio de um parâmetro global, utilizado por todos os usuários do sistema. Esse modelo atende ao processo atual, porém gera limitações em cenários onde diferentes usuários precisam emitir boletos de bancos distintos simultaneamente.\nDessa forma, solicitamos a implementação de uma melhoria para que a configuração do banco emissor do boleto possa ser definida por usuário, evitando a necessidade de alteração constante do parâmetro global e reduzindo o risco de emissões incorretas.\nComo sugestão de implementação, essa configuração poderia ser apresentada por meio de uma tela de Perguntas (SX1) ou de um mecanismo semelhante ao F12 do Protheus, permitindo que cada usuário selecione o banco desejado no momento da emissão, sem impactar os demais usuários.\nImpacto:\nEssa melhoria proporcionará maior flexibilidade operacional, segurança no processo de emissão e melhor adequação às rotinas de empresas que trabalham com múltiplos bancos.\nUrgência:\nNormal\nResponsável pela análise:\nLucas", "atrasado": "false"}, {"nome": "[Decio] -Homologação da VPN GSurf na SmartPOS Kingposto Móvel", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000237\nOlá Wellington,\nGostaria de reforçar a importância de avançarmos com a homologação da solução de VPN da GSurf na SmartPOS Kingposto Móvel.\nAtualmente, na Fiserv, não possuímos uma gestão otimizada das licenças. Na prática, a nível de cliente, não temos gestão efetiva — apenas conseguimos visualizar o último token gerado e a quantidade de terminais liberados para determinado token, sem controle detalhado ou histórico confiável.\nAlém disso, o processo de ativação é extremamente sensível e precisa ser seguido rigorosamente. Caso haja qualquer atraso ou inconsistência, perdemos toda a ativação do novo terminal e precisamos reiniciar o fluxo. Hoje, as etapas são:\nAcionar Totvs/Sitefpara verificar a quantidade de Totens disponíveis para a unidade;\nSolicitar ao suporte Totvs/Fiservo reset do token (pois o totem expira);\nAtribuir o novo token na GPOS720 para realizar a ativação;\nSolicitar ao suporte Totvs/Fiserva aprovação do terminal.\nObservação: caso o passo 4 ultrapasse o prazo de 24 horas para aprovação, é necessário reiniciar todo o processo.\nAlém da complexidade operacional, enfrentamos alguns problemas recorrentes na plataforma:\nPossível duplicidade de nome de host no portal da Fiserv, sem possibilidade de identificação clara pelo número único;\nDivergência entre a quantidade de terminais no histórico de ativação (cobrada pela Fiserv à Totvs, que nos repassa a cobrança) e o quantitativo real que possuímos, reflexo direto da ausência de gestão adequada;\nErros relacionados a licenças expiradas, nomes de host repetidos, código único duplicado ou até excluído.\nInclusive, será necessária uma reimplantação das VPNs Fiserv, pois recebemos um comunicado informando que estamos utilizando mais licenças do que o contratado. Contudo, essa informação não é verificável com os controles atualmente disponíveis. Em conversa com Adriano Machado, já expus detalhadamente essa situação.\nDiante desse cenário, reforço nossa solicitação para homologarmos a solução da GSurf. Conforme pontuado pelo Rafael e também pelo Adriano, a GSurf permitirá uma gestão mais confiável", "atrasado": "false"}, {"nome": "[Decio] -KingPosto Fixo – Consulta Automática de Orçamentos por Placa E Controle e Governança de Orçamentos Pendentes", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesk: 202606001226\nNecessitamos que o KingPosto Fixo apresente automaticamente os orçamentos existentes para a placa consultada durante o atendimento.\nObjetivos:\nExibir orçamentos pendentes;\nFacilitar recuperação de vendas;\nReduzir tempo operacional do vendedor e operador de caixa.\nNecessitamos implementar mecanismos de controle para impedir o encerramento indevido de atendimentos com orçamentos pendentes.\nObjetivos:\nBloquear finalização quando existirem orçamentos vinculados à placa;\nExigir autorização por alçada para exclusão de orçamentos;\nRegistrar rastreabilidade das ações realizadas", "atrasado": "false"}, {"nome": "[Decio] -KingPosto Móvel – Ampliação de Perfis de Acesso e Supervisão Operacional", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesk:202606001221\nNecessitamos criar novos perfis de acesso no KingPosto Móvel para permitir atuação mais ampla da supervisão operacional e viabilizar utilização da ferramenta em novos cenários de atendimento.\nObjetivos:\nPermitir que usuários com perfil de supervisão visualizem os abastecimentos realizados por todos os frentistas da unidade;\nApoiar a operação Diesel através do dispositivo móvel;\nPossibilitar apoio operacional em períodos de alto fluxo.\nBenefícios Esperados:\nMelhor acompanhamento operacional;\nRedução de filas;\nMaior produtividade da equipe.", "atrasado": "false"}, {"nome": "[Decio] -Melhoria na Navegação da Lista de Abastecimentos – Congelamento de Cabeçalho", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000273\nDescrição\nPrezados,\nSolicito uma melhoria na usabilidade da tela de Abastecimentos.\nAtualmente, ao rolar a listagem para baixo, o cabeçalho com os nomes das colunas desaparece. Isso dificulta a interpretação dos dados, pois perdemos a referência sobre o que cada coluna representa.\nNecessitamos que o comportamento seja similar ao recurso “Congelar Linha Superior” do Excel, onde o cabeçalho permanece fixo no topo da tela enquanto navegamos pela lista. Dessa forma, mesmo ao descer a página, as informações das colunas continuam visíveis, facilitando a leitura e reduzindo erros operacionais.\nAgradeço desde já pela análise e implementação da melhoria.", "atrasado": "false"}, {"nome": "[Decio] -Melhoria – Exibição da forma de pagamento nos dados adicionais da NF (Rodapé)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000267\nPrezados,\nNossa área de negócio Comercial solicitou uma melhoria no produto Kingposto, referente às informações exibidas nas notas fiscais.\nAtualmente, não consta no rodapé / dados adicionais da nota fiscal a descrição da forma de pagamento utilizada (ex.: dinheiro, cartão, PIX, vale combustível, etc.).\nAntes da virada de sistema, quando utilizávamos o TOTVs PDV, essa informação já era apresentada no rodapé da nota fiscal, atendendo a uma necessidade operacional e comercial.\nSolicitação:\nImplementar melhoria para que a forma de pagamento seja exibida nos dados adicionais / rodapé da nota fiscal emitida pelo Kingposto.\nJustificativa:\nAtender solicitação da área comercial\nFacilitar conferência pelo cliente e pela operação\nManter padrão já existente no sistema anterior (TOTVs PDV)\nFicamos no aguardo da análise de viabilidade, prazo e orientações para implantação.", "atrasado": "false"}, {"nome": "[Decio] -Melhoria – Fechamento automático de turno/caixa após 24 horas (Turno em aberto)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000266\nPrezados,\nRecebemos uma solicitação da Supervisora de Operação, Michele Karoline, referente ao funcionamento de turnos/caixas em aberto no sistema Kingposto.\nAtualmente, mesmo com a virada do dia (00h00), o sistema obriga o operador a realizar o fechamento do turno, porém, na prática, ocorrem situações em que o operador se ausenta e o turno permanece em aberto por longos períodos.\nSolicitação:\nAvaliar a possibilidade de parametrização de uma trava automática, para que caso o turno/caixa permaneça aberto por 24 horas, o sistema realize o fechamento automático\nJustificativa:\nEvitar turnos esquecidos em aberto\nReduzir riscos operacionais e inconsistências de caixa\nAderência à própria regra do sistema que exige fechamento na virada do dia\nApoiar cenários em que o operador se ausenta sem realizar o fechamento\nSolicitamos, por gentileza, a avaliação técnica da viabilidade, possíveis impactos, e a indicação de prazo e forma de implementação (parametrização ou melhoria sistêmica).\nFicamos no aguardo.", "atrasado": "false"}, {"nome": "[Decio] -Necessidade de melhoria no processo de atualização do Kingposto – dependência de execução como Administrador", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000269\nAtualmente, a solução do Kingposto exige que a aplicação seja executada utilizando “Executar como Administrador” para que o processo de atualização ocorra corretamente.\nDo ponto de vista da nossa área de Tecnologia, esse comportamento não é aderente às boas práticas de segurança e governança, uma vez que:\nNão mantemos usuários com perfil de administrador local nas estações;\nEvitamos qualquer cenário que envolva compartilhamento de credenciais administrativas;\nTodas as permissões e políticas são gerenciadas via Active Directory (AD).\nDessa forma, solicitamos a avaliação de uma solução alternativa para o mecanismo de atualização do Kingposto, que:\nRespeite as políticas de segurança definidas no nosso AD;\nNão exija a execução da aplicação com privilégios de administrador local;\nPermita a atualização de forma transparente ao usuário operacional.\nNosso objetivo é manter o ambiente seguro, padronizado e em conformidade com as práticas de segurança da informação, sem impacto na operação.\nFicamos no aguardo de uma orientação ou proposta técnica para atender esse cenário.", "atrasado": "false"}, {"nome": "[Decio] -Reimpressão não permitida para NFSe em contingência", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000275\nIdentificamos que, quando uma nota fiscal está em contingência, o sistema Kingposto permite a reimpressão normalmente para NF-e e NFC-e.\nNo entanto, para NFSe, essa opção não está disponível, mesmo quando a nota se encontra em contingência.\nComportamento atual:\nNF-e e NFC-e em contingência: reimpressão permitida.\nNFSe em contingência: reimpressão não permitida.\nComportamento esperado:\nA NFSe em contingência deve permitir reimpressão,\nO comportamento deve ser equivalente ao adotado para NF-e e NFC-e.\nSolicitação:\nAvaliar e ajustar o sistema para habilitar a reimpressão de NFSe em contingência, garantindo padronização com os demais tipos de documento fiscal", "atrasado": "false"}, {"nome": "[Decio] -Solicitação de desenvolvimento – Consumo de pontos Promoflex no KingPosto", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000234\nGostaria de solicitar a análise e desenvolvimento de uma funcionalidade no KingPosto para permitir o consumo de pontos do Promoflex diretamente no sistema, possibilitando a troca de pontos por serviços/produtos.\nInicialmente, a principal necessidade é permitir a troca de pontos por diárias de estacionamento, porém a funcionalidade deve permitir também a utilização para outras situações futuras, conforme regras de negócio que venham a ser definidas.\nAlém da funcionalidade de consumo dos pontos, precisamos também que seja implementado um registro de log detalhado dessas operações, visando rastreabilidade e auditoria. Sugerimos que sejam registrados, no mínimo, os seguintes dados:\nData e hora da operação\nOperador de caixa / usuário responsável\nQuantidade de pontos consumidos\nProduto ou serviço concedido na troca\nNúmero do ticket ou placa do veículo vinculada à operação\nPDV / terminal onde a operação foi realizada", "atrasado": "false"}, {"nome": "[Decio] -Solicitação de Implementação de Logs – Abono de Ticket e Abertura de Cancela", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk:202603000233\nGostaríamos de registrar uma solicitação de melhoria referente à implementação e complementação de logs operacionais no sistema, com o objetivo de aumentar a rastreabilidade, auditoria e governança dos processos relacionados ao estacionamento.\n1. Log de Abono de Ticket de Estacionamento\nAtualmente, quando ocorre o abono de um ticket de estacionamento que deveria ser cobrado, o operador informa um usuário com alçada para liberação. Porém, é necessário que essas ações fiquem devidamente registradas em log para fins de auditoria.\nSolicitamos a implementação de um registro contendo, no mínimo, os seguintes campos:\nData e hora da operação\nUnidade\nOperador de caixa que realizou a operação\nUsuário de liberação (usuário com alçada)\nTicket e/ou placa do veículo\nMotivo do abono\n2. Log de Abertura Manual de Cancela\nTambém solicitamos o registro completo das aberturas manuais de cancela, tanto de entrada quanto de saída, quando realizadas por usuários com alçada (ex.: promotor de vendas ou supervisor).\nO log deverá conter, no mínimo:\nData e hora da operação\nUnidade\nOperador de caixa que realizou a operação\nUsuário de liberação (usuário com alçada)\nTicket e/ou placa do veículo\nTipo de operação (abertura de entrada ou saída)\nMotivo da abertura manual\nObjetivo\nEssa solicitação tem como objetivo garantir maior controle operacional, rastreabilidade e capacidade de auditoria, principalmente em situações que envolvem liberação manual ou exceções ao fluxo padrão de cobrança do estacionamento.", "atrasado": "false"}, {"nome": "[DECIO] [API-FROTA] Solicitação de melhoria – Administradora X7 - Recolha Autonoma", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "2026-07-01", "data_conclusao": "2026-07-14", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000177\nLink da Documentação: https://documenter.getpostman.com/view/9081034/TzeZERiX#ab4c07b5-e3df-4a05-b126-8c95379b4761\nEstamos solicitando a análise e eventual implementação de melhorias nas integrações via API do TEF, especificamente para a administradora X7, com foco na identificação correta do CNPJ e/ou cliente no momento da transação do cartão frota.\nAtualmente, a ausência ou limitação dessa identificação no momento da venda (ponta do TEF) tem gerado impactos diretos nos processos de Faturamento, Financeiro e Diretoria, especialmente nos seguintes cenários:\nTransações associadas a cliente ou CNPJ incorreto\nDivergência de preço praticado em relação ao contrato/acordo do cliente\nNecessidade de ajustes manuais no faturamento\nProcessos de troca, estorno ou devolução excessivamente morosos e operacionais\nQuando um problema ocorre na origem da venda, o mesmo erro se propaga para as etapas de faturamento e recebimento, gerando retrabalho, riscos financeiros e desgaste com o cliente.Objetivo da Solicitação\nViabilizar que, no momento da transação TEF, seja possível:\nIdentificar corretamente o cliente e/ou CNPJ vinculado ao cartão X7\nValidar essas informações via API, preferencialmente de forma síncrona\nGarantir que a transação seja concluída somente quando os dados estiverem corretos, evitando correções posteriores\nO objetivo é assegurar a conformidade da venda na origem, reduzindo exceções operacionais e impactos financeiros.Contexto e Prioridade\nEsta solicitação é uma demanda direta da Diretoria, com acompanhamento das áreas Financeira e de Faturamento, devido a recorrências operacionais observadas no cenário atual.\nA validação correta no momento da venda é essencial para:\nIntegridade das informações comerciais\nEficiência no faturamento\nSegurança no processo de cobrança e recebimentoConsiderações Finais\nSolicitamos, por gentileza, o retorno quanto à viabilidade técnica, possíveis limitações de integração e alternativas de implementação para atender ao cenário descrito.", "atrasado": "true"}, {"nome": "[DECIO] [API-FROTA] Solicitação de melhoria – GASOLA Recolha Autônoma", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "2026-07-01", "data_conclusao": "2026-07-14", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000184\nEstamos solicitando a análise e implementação de melhorias nas APIs de integração do TEF, especificamente para a bandeira GASOLA, com foco na identificação correta do CNPJ e/ou cliente no momento da transação do cartão frota.\nAtualmente, quando não ocorre a validação adequada dessas informações na ponta da venda, eventuais inconsistências acabam sendo propagadas para as etapas posteriores do processo, gerando impactos diretos nas áreas de Faturamento, Financeiro e Diretoria, tais como:\nTransações associadas a cliente ou CNPJ incorreto\nDivergência de preço praticado em relação ao contrato do cliente\nNecessidade de ajustes manuais no faturamento\nProcessos de troca, estorno ou devolução excessivamente morosos e operacionais\nQuando a venda não ocorre corretamente validada no TEF, o problema permanece até o faturamento e o recebimento, gerando retrabalho, riscos financeiros e desgaste com o cliente.Objetivo da Solicitação\nViabilizar que, no momento da transação TEF, seja possível:\nIdentificar corretamente o cliente e/ou CNPJ vinculado ao cartão GASOLA\nRealizar a validação dessas informações via API, preferencialmente em tempo real\nGarantir que a transação seja concluída apenas quando os dados estiverem corretos, evitando correções posteriores\nO objetivo é assegurar a conformidade da venda na origem, reduzindo exceções operacionais e impactos financeiros.Contexto e Prioridade\nEsta é uma demanda direta da Diretoria, com acompanhamento das áreas Financeira e de Faturamento, motivada por recorrências operacionais observadas no cenário atual.\nA validação correta no momento da venda é fundamental para:\nGarantir integridade das informações comerciais\nEvitar retrabalho no faturamento\nReduzir riscos no processo de cobrança e recebimentoConsiderações Finais\nSolicitamos, por gentileza, o retorno quanto à viabilidade técnica, eventuais limitações de integração e possíveis alternativas de implementação para atender a este cenário.", "atrasado": "true"}, {"nome": "[DECIO] [API-FROTA] Solicitação de melhoria – Identificação de CNPJ/Cliente via API na transação TEF (Bandeira RedeFrota)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000183\nEstamos solicitando a análise e implementação de melhorias nas APIs de integração do TEF, especificamente para a bandeira RedeFrota, com foco na identificação correta do CNPJ e/ou cliente no momento da transação do cartão frota.\nAtualmente, a ausência ou limitação dessa validação na ponta da venda tem gerado impactos diretos nos processos de Faturamento, Financeiro e Diretoria, especialmente nos seguintes cenários:\nTransações vinculadas a cliente ou CNPJ incorreto\nDivergência de preço praticado em relação às regras contratuais do cliente\nNecessidade de ajustes manuais no faturamento\nProcessos de troca, estorno ou devolução excessivamente morosos e operacionais\nQuando a venda não é corretamente validada no momento da transação TEF, o problema se propaga até as etapas de faturamento e recebimento, gerando retrabalho, riscos financeiros e desgaste com o cliente.Objetivo da Solicitação\nGarantir que, no momento da transação TEF, seja possível:\nIdentificar corretamente o cliente e/ou CNPJ vinculado ao cartão RedeFrota\nValidar essas informações via API, preferencialmente de forma síncrona\nAssegurar que a venda seja concluída somente quando os dados estiverem corretos, evitando correções posteriores\nO objetivo é assegurar a conformidade da venda na origem, reduzindo exceções operacionais, retrabalho e impactos financeiros.Contexto e Prioridade\nEsta solicitação é uma demanda direta da Diretoria, com acompanhamento das áreas Financeira e de Faturamento, em função das recorrências operacionais observadas no cenário atual.\nA validação correta na ponta da venda é essencial para:\nIntegridade das informações comerciais\nEficiência no faturamento\nSegurança no processo de cobrança e recebimentoConsiderações Finais\nSolicitamos, por gentileza, a avaliação da viabilidade técnica, eventuais limitações de integração e possíveis alternativas de implementação para atender a este cenário.", "atrasado": "false"}, {"nome": "[DECIO] [API] Envio Preços - Integração com Rede Frota", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "2026-08-03", "data_conclusao": "2026-08-14", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "", "atrasado": "false"}, {"nome": "[DECIO] [API] Integração com eFleet [API] Integração com eFleet", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000181\nSolicitamos a análise de viabilidade e posterior desenvolvimento de uma nova integração via API com a eFleet, com o objetivo de automatizar o envio, atualização e consulta de preços praticados com clientes da nossa base.\nA integração proposta trará ganhos significativos, como:\nRedução de mão de obra manual, atualmente necessária para manutenção desses dados;\nAumento da segurança das informações, minimizando riscos de erros humanos e inconsistências;\nMelhoria na agilidade e confiabilidade das atualizações de preço.\nSolicitamos, por gentileza, que seja realizada:\nAnálise técnica da integração;\nEstimativa de esforço para desenvolvimento (prazo e recursos);\nProposta de custos envolvidos, caso existam.\nCaso necessário, estamos à disposição para agendar uma reunião com a área de negócios e/ou com o time técnico responsável pela API da Rede Frota, a fim de esclarecer dúvidas e alinhar os próximos passos.\n-\nSegue link da documentação: Integra eFleet", "atrasado": "false"}, {"nome": "[DECIO] [API] Integração de Venda com Portal de Frota", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000178\nm anexo o material do Pró-Frotas onde hoje transacionamos via portal e depois baixamos via POS no sistema KGP.\nAcredito que com esse material seria possível a integração com o portal possibilitando vendas com integração de pagamentos digitais e documentos fiscais, visando adequação à legislação SINIEF de Goiás, que em um futuro próximo, acreditamos entrar em vigor em teor nacional.", "atrasado": "false"}, {"nome": "[DECIO] [API] Sanvitron - Melhorias para Auditoria e validação em TAP", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000175\nPossibilitar abono de ticket pelo número do ticket ou pela placa do veículo;\nHabilitar a abertura de cancela diretamente pelo KingPosto, sempre vinculada à placa;\nTornar obrigatória a informação de placa e motivo para qualquer liberação;\nRegistrar todas as ações de abono e abertura, incluindo ticket, placa, motivo, operador (turno) e supervisor responsável, de forma que esses dados possam ser consultados e analisados no Protheus.\nComo o processo de abono envolve regras de negócio específicas, é importante que as informações gravadas na liberação estejam associadas a essas condições. Entre elas:\nPara clientes cadastrados, considerar as compras ou notas dos últimos 30 dias;\nPara clientes não cadastrados, avaliar o volume de compra (200L) e prazo (15 dias) para definir a liberação.\nOutra questão que vai nos apoiar muito referente a essa ponto de validação do Ticket é implementar a solução de validação/pagamento do Ticket pelo TAP (Terminal de Auto-pagamento).", "atrasado": "false"}, {"nome": "[DECIO] [Comercial] Implementação de Preço Base como limitador de desconto manual no PDV – King Posto", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Atualmente, trabalhamos com 3 cenários de precificação integrados entre Protheus e King Posto:\nPreço de bomba\nValor padrão da tabela de preços do produto.\nPreço Base\nCadastro vindo do Protheus e integrado ao King Posto, permitindo configuração de preços diferenciados por:\nProduto\nForma de pagamento\nAdministradora financeira\nO preço base funciona atualmente como um “preço negociado simplificado”, porém sem filtro por cliente.\nPreço Negociado\nPreço específico por cliente, considerando os filtros configurados.\nCenário Atual\nExemplo:\nGasolina Comum – Preço de bomba: R$ 10,00\nPreço Base para Cartão de Crédito: R$ 9,00\nCliente com preço negociado para o Cartão de Crédito: desconto de R$ 1,00 (sobre o preço base)\nResultado final do cliente: R$ 8,00\nAté este ponto, o comportamento está correto.\nComportamento Atual\nHoje, quando ocorre desconto manual no PDV, o sistema calcula o desconto sempre em cima do preço de bomba, ignorando o preço base cadastrado.\nExemplo:\nGasolina Comum – Preço de bomba: R$ 10,00\nUsuário do PDV possui permissão de 50% de desconto\nResultado possível no PDV: R$ 5,00\nAtualmente isso acontece independentemente da existência de preço base.\nNecessidade Solicitada pelo Comercial\nO time comercial solicita que o Preço Base passe a atuar também como preço mínimo permitido para descontos manuais no PDV.\nOu seja:\nRegra desejada\nQuando existir preço base cadastrado o desconto manual não poderá ultrapassar esse valor mínimo.\nExemplo EsperadoCenário 1 – Sem Preço Base\nGasolina Comum: R$ 10,00\nUsuário com 50% de desconto\nResultado permitido: até R$ 5,00\n(Comportamento atual e desejado)\nCenário 2 – Com Preço Base\nGasolina Comum – Preço de bomba: R$ 10,00\nPreço Base para Cartão de Crédito: R$ 9,00\nUsuário com 50% de desconto manual\nResultado esperado:\nMesmo com permissão de 50%, o desconto manual deve respeitar o preço base como limite mínimo, permitindo no máximo chegar a R$ 9,00.\nObjetivo da Solicitação\nGarantir que os descontos manuais realizados no PDV não ultrapassem os valores estratégicos definidos pelo comercial através do cadastro de Preço Base, evitando vendas abaixo da política comercial definida para determinadas condições de pagamento.", "atrasado": "false"}, {"nome": "[DECIO] [FATURAMENTO] Melhoria na rotina de funções NF e NFC para reimpressão de NFS-e emitida pelo PDV", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Solicitamos uma melhoria relacionada ao processo de emissão e faturamento de Nota Fiscal de Serviço Eletrônica (NFS-e) emitida pelo PDV.\nIniciamos na unidade de Rio Verde a emissão de NFS-e diretamente pelo PDV, processo que atualmente está funcionando corretamente, realizando a emissão automática da nota para o cliente no momento da venda.\nDurante a evolução do processo, identificamos um GAP operacional na rotina de faturamento manual V2 do Protheus, pois os clientes não aceitam receber faturamento conjunto de produtos e serviços. Para atender essa necessidade, foi desenvolvido recentemente um filtro na rotina permitindo selecionar:\nProduto\nServiço\nTodos\nCom isso, conseguimos separar corretamente os faturamentos.\nPorém, ainda existe uma dificuldade operacional importante relacionada ao envio dos anexos das notas fiscais no faturamento. Atualmente, a rotina de faturamento manual V2 já possui funcionalidade para anexar automaticamente comprovantes/documentos de NF-e/NFC-e, porém essa funcionalidade não contempla a NFS-e emitida pelo PDV.\nHoje, para obter a NFS-e, a operação precisa:\nAcessar manualmente o portal da prefeitura;\nLocalizar a nota;\nRealizar o download do documento;\nAnexar manualmente no faturamento.\nÀ medida que novas unidades passarem a utilizar emissão de NFS-e pelo PDV, essa atividade operacional tende a aumentar significativamente.\nAtualmente já existe no Protheus a rotina “Funções NFe NFCe”, utilizada para reimpressão de NF-e e NFC-e.\nDessa forma, solicitamos como melhoria que a rotina “Funções NFe NFCe” também passe a permitir Reimpressão da NFS-e emitida pelo PDV.\nO objetivo é facilitar e automatizar o processo operacional de faturamento manual de serviços emitidos via PDV, reduzindo atividades manuais e dependência de acesso aos portais das prefeituras.", "atrasado": "false"}, {"nome": "[DECIO] [FECHAMENTO] Turnos em aberto KingPosto", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Bom dia.\nHoje quando ocorre um chamado pro TI referente a turno que está aberto na retaguarda ser data/hora de fechamento no TotvsPDV temos a opção de entrar no banco e ver na SLW,\nTemos opção de atualizar status pela retaguarda ou atribuir LW_SITUA = '00' no PDV pra subir o turno caso ele tenha fechado, ou até, orientar o operador que o turno não foi fechado.\n \nJá no KingPosto não temo essa opção aqui pela retaguarda, a nível de TI, então o fluxo é muito burocrático, as ações tomadas são:\n Questionar a Duofy se o turno está realmente aberto na KGP ou se foi erro de integração\nCaso esteja aberto no KGP precisamos orientar o solicitante, geralmente a tesouraria, a fechar o turno na KGP\nA tesouraria orienta ou o operador de caixa pra fechar, caso ele esteja ausente,\nA tesouraria orienta o supervisor a fechar o turno aberto do operador, sendo necessário entrar pelo KGP Móvel pra realizar o processo\n \nPrecisamos então de uma ferramenta que resume todo esse fluxo, possibilitando que seja feito a nível de retaguarda essa verificação, se está fechado ou aberto no KGP, e ação de fechamento de turno caso esteja aberto no KGP e operador ausente.\nEssa conversa foi feita na daily de sexta-feira (14/03/25).\nFoi acordado que no primeiro momento, prezando atendimento ágil, será disponibilizado um relatório pra que possamos fazer a etapa de verificação.", "atrasado": "false"}, {"nome": "[DECIO] [FMV2] - Erro tabela FI7 - 202606001406", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "2026-07-20", "data_conclusao": "2026-07-21", "rotulos": "Erro;Suporte", "notas": "Título: Bug na deleção de registros FI7 no estorno da rotina de Faturamento Manual.\nDescrição padrão\nOrigem: Suporte.\nSolicitante: DECIO\nTipo: Erro.\nContexto: O processo de faturamento de postos exige aglutinação de cupons em faturas (Módulo 97). Quando o usuário precisa corrigir uma fatura, ele utiliza o botão \"Cancelar\" na rotina.\nProblema identificado: A função de cancelamento da rotina está deletando apenas o título na SE1. O registro do cabeçalho de faturamento na tabela FI7 permanece íntegro com o campo D_E_L_E_T_ vazio, caracterizando falha na deleção lógica/física.\nImpacto: Risco fiscal e gerencial. Relatórios de faturamento apresentam valores duplicados ou inflados. Acúmulo de dados desnecessários (33 mil registros no ano corrente).\nUrgência: Alta. Compromete a confiabilidade dos relatórios financeiros da diretoria.\nAnexos / evidências: Vídeo demonstrativo. https://grupodecio-my.sharepoint.com/:v:/g/personal/kaua_tetzlaff_grupodecio_com_br/IQB6sWgCgcHqSJsJhHJaWH6GARtQbXKZm_YCuC_FaaeeBX4?e=lVDCNf\nResponsável pela análise: José Abinoan.", "atrasado": "true"}, {"nome": "[DECIO] [KGP Móvel] Erro ao transacionar cartão frota", "categoria": "Em Análise", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "202604000423\nSeguem evidências em anexo de erro ao tentar transacionar o cartão frota na smartPOS;", "atrasado": "false"}, {"nome": "[DECIO] [KGP-Móvel] Verificar compatibilidade da máquina Positivo L400", "categoria": "Em Análise", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000162\nEm reunião com a CIELO foi entendido que em um futuro próximo as máquinas comercializadas em prateleira serão a L400.\nGostaria de entender se já está mapeado pela Dyofy/Kingposto por favor?", "atrasado": "false"}, {"nome": "[DECIO] [KGP] Ajuste na validação de abastecimentos pendentes de dias anteriores", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Identificamos um cenário operacional que está permitindo contornar a validação existente de abastecimentos pendentes de dias anteriores no sistema.\nHoje, a regra funciona da seguinte forma:\nO sistema impede a baixa de abastecimentos do dia atual enquanto existirem abastecimentos pendentes de dias anteriores;\nA intenção da validação é garantir que não permaneçam abastecimentos antigos pendentes na tela e evitar inconsistências operacionais.\nPorém, a operação identificou uma forma de burlar essa validação:\nOs abastecimentos pendentes do dia anterior são baixados normalmente;\nApós a virada do dia, o operador realiza o cancelamento do cupom referente a esses abastecimentos;\nCom isso, os abastecimentos voltam a ficar pendentes, porém o sistema continua permitindo a operação e baixa dos abastecimentos do dia atual, sem exigir novamente a regularização dos pendentes anteriores.\nNa prática, isso faz com que a trava perca sua efetividade, permitindo que abastecimentos antigos perm
