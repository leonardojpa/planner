as vezes\nAnexos / evidências:\nDocumentação do passo a passo para correção manual em anexo.\nResponsável pela análise:\nIgor | Lucas", "atrasado": "false"}, {"nome": "[TRAPEZIO]  Faturamento manual cliente a prazo - 202605001017", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "", "atrasado": "false"}, {"nome": "[TRAPEZIO] - CHAVE DE ACESSO NÃO SAINDO NA NOTA - 202607002031", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Origem: Suporte.\nSolicitante: TRAPEZIO\nTipo: Correção / Produto.\nContexto: Impressão de NF-e (Modelo 55).\nProblema identificado: Ao emitir a NF-e no modelo 55, o documento impresso nas impressoras Epson TM-T20X não apresenta o número da chave de acesso (44 dígitos).\nImpacto: Reclamações recorrentes dos clientes finais pela falta de informação obrigatória para consulta fiscal.\nUrgência: Média.\nAnexos / evidências: Especificações confirmadas pelo cliente: duas impressoras do modelo Epson - TM T20X.\nResponsável pela análise: José", "atrasado": "false"}, {"nome": "[Trapezio] - Erro de finalização de venda com TEF.", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Suporte", "notas": "Contexto:\nTivemos uma call com o time da trapézio e foi relatado que está ocorrendo em todas unidades deles um erro de ao finalizar uma venda com o TEF o PDV dá um erro e limpa o lançamento em andamento da tela.\nProblema identificado:\nIdentificado um erro no log do PDV referente ao processo do TEF, que ao finalizar a transação o mesmo dá uma mensagem de \"Forma de pagamento não encontrada\". Em anexo segue o log do PDV e também o log exportado da central pdv do kingposto.\n## Erro ##\n[2026-06-17 16:34:06.393] [error] (TEF)        Erro ao persistir pagamento TEF KPHttpError: Forma de pagamento não encontrada\nat SaleService.addOrUpdatePaymentMethod (file:///C:/Program%20Files/Kingposto%20PDV/resources/app.asar/dist/assets/index-906969a1.js:563:182833)\nat async hn (file:///C:/Program%20Files/Kingposto%20PDV/resources/app.asar/dist/assets/index-906969a1.js:739:89781)\nat async file:///C:/Program%20Files/Kingposto%20PDV/resources/app.asar/dist/assets/index-906969a1.js:564:24792\nImpacto:\nRetrabalho e perca de venda.\nUrgência:\nImpato na operação e erros de lançamento.\nResponsável pela análise:\nFelipe Sousa.", "atrasado": "false"}, {"nome": "[Trapezio] -Faturamento automático - Posto Inteligente", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesk:202605001100\n( Ela que que tenha uma automação na rotina no processo de faturamento. Implementar uma rotina de faturamento automático , onde seja possível processar em horário pre definido.)\nAtualmente, o processo de faturamento no posto inteligente - no Protheus exige intervenção totalmente manual. Precisamos deslocar um analista diariamente apenas para acessar o sistema, selecionar os dados e executar a movimentação de faturamento.\nPor se tratar de uma rotina puramente operacional, morosa e que não envolve tomada de decisões complexas ou análises críticas, a execução manual gera um desperdício crônico de tempo de um profissional qualificado, além de atrasar o fluxo financeiro caso o analista esteja focado em outra demanda.\nObjetivo\nImplementar uma rotina de agendamento automático (Schedule / Cron Job) no sistema King, permitindo que o faturamento seja processado em horários pré-definidos (ex: de hora em hora, ou ao final do dia) sem a necessidade de intervenção humana.\nBuscamos\nOtimização de Recursos: Liberação imediata de horas de trabalho do analista, que deixa de executar uma tarefa robótica.\nPontualidade e Consistência: Garantia de que o faturamento ocorrerá sempre nos horários corretos, agilizando o fluxo de caixa.\nRedução de Erros Operacionais: Elimina o risco de esquecimento ou atraso humano na virada do faturamento", "atrasado": "false"}, {"nome": "[Trapezio] -Geração Contas a receber a a partir da venda", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000289\nTemos uma integração do PDV king com o clube fidelidade 99 , os descontos são partes 99 e partes grupo trapezio, preciso que a parte da 99 gere um contas a receber para o cliente cod 002805 - 99 TECNOLOGIA\n{\"data\":{\"uuid\":\"16907649-ed44-9180-9394-48b991bbae1d\",\"orderId\":\"16907649-ed44-9180-9394-48b991bbae1d\",\"orderItems\":[{\"uuid\":\"08964185-ba8d-9e15-b4a3-d81a4ee8843b\",\"99Discount\":21.68,\"productCode\":\"000001\",\"discountAmount\":41.19,\"partnerShipFee\":0,\"stationDiscount\":19.51}],\"totalDiscount\":41.19,\"total99Discount\":21.68,\"totalPartnerShipFee\":0,\"totalStationDiscount\":19.51,\"totalDiscountedOrderAmount\":183.81},\"errno\":0,\"errmsg\":\"\",\"trace_id\":\"0a8f313369babe921dff211205083602\"}\nlinha total99Discount\":21.68", "atrasado": "false"}, {"nome": "[Trapezio] -Geração Contas a receber a a partir da venda", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk:202603000289\nTemos uma integração do PDV king com o clube fidelidade 99 , os descontos são partes 99 e partes grupo trapezio, preciso que a parte da 99 gere um contas a receber para o cliente cod 002805 - 99 TECNOLOGIA\n{\"data\":{\"uuid\":\"16907649-ed44-9180-9394-48b991bbae1d\",\"orderId\":\"16907649-ed44-9180-9394-48b991bbae1d\",\"orderItems\":[{\"uuid\":\"08964185-ba8d-9e15-b4a3-d81a4ee8843b\",\"99Discount\":21.68,\"productCode\":\"000001\",\"discountAmount\":41.19,\"partnerShipFee\":0,\"stationDiscount\":19.51}],\"totalDiscount\":41.19,\"total99Discount\":21.68,\"totalPartnerShipFee\":0,\"totalStationDiscount\":19.51,\"totalDiscountedOrderAmount\":183.81},\"errno\":0,\"errmsg\":\"\",\"trace_id\":\"0a8f313369babe921dff211205083602\"}\nlinha total99Discount\":21.68", "atrasado": "false"}, {"nome": "[Trapezio] -Trava de relaório PDV", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Muvdesok: 202603000288\nPreciso de um bloqueio na visualização do relatorio “Imprimir Relatório de caixa”", "atrasado": "false"}, {"nome": "[TRAPEZIO] 1 - Integração com o Clube Trapézio (PDV móvel)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Centralização de amarração do da regra de preço, regra de venda, cadastro motorista, cadastro veículo e dados obrigatórios em uma única tela.", "atrasado": "false"}, {"nome": "[TRAPEZIO] 3 - Portal Do cliente (FROTA)", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Centralização de amarração do da regra de preço, regra de venda, cadastro motorista, cadastro veículo e dados obrigatórios em uma única tela. \n \nOs clientes acompanham toda a parte de gestão da frota pelo portal do cliente: Portal Web\nCadastro de placas\nGerar segunda via de notas, boletos, faturas \n \nImplementar regra de desconto por grupo de produto", "atrasado": "false"}, {"nome": "[TRAPEZIO] 6 - Sangria integrada ao cofre Brinks", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "2026-06-30", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Para sangria é considerado (valor, hora, numero de documento e PDV.) - Integração com a Brinks", "atrasado": "true"}, {"nome": "[TRAPEZIO] ANEXO NO FATURAMENTO - NF SERVIÇO/LAVAGEM", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Boa tarde\nEstá sendo emitido a nota do lava car no posto TS, algumas notas são a prazo, quando vamos fazer o faturamento vai em anexo as notas, fatura e boleto, porém a nota de serviço não vai.\nPreciso que tudo que esteja no faturamento vá como anexo ao cliente", "atrasado": "false"}, {"nome": "[Trapezio] AUMENTA CARACTERES DE NSU", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Lucas  de Jesus Oliveira", "criado_por": "Lucas  de Jesus Oliveira", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000256\nBoa tarde,\nPrecisamos aumentar o carácter da NSU para 11 caracteres, pois atualmente não comporta todos o digitos.", "atrasado": "false"}, {"nome": "[TRAPEZIO] Automatização da Gravação do LMC - Veeder - 202605001095", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Problema Atual\nAtualmente, o LMC (Livro de Movimentação de Combustíveis) no Posto Inteligente é alimentado de forma automática com base no lançamento da medição dos tanques. No entanto, o processo trava na etapa final: que não é gravado definitivamente.\nIsso ocorre porque o sistema aguarda de forma passiva a conclusão humana, o processo exige um clique manual posterior, gerando atrasos e risco de esquecimento na escrituração do livro.\nObjetivo\nCriar um gatilho automático (trigger) para que, os combustíveis sejam alimentados no sistema Posto Inteligente com a gravação final do LMC eliminando a necessidade de intervenção manual para o fechamento do livro.\nPermitindo inclusive recalculo antes da apuração do ICMS, visto que podem haver lançamentos de notas de combustíveis com delay de 24 hrs, ou um final de semana. \nImpacto Esperado\nAutomação de ponta a ponta: O LMC passa a ser preenchido pela medição e fechado pelo CRC, sem cliques intermediários.\nConformidade Fiscal: Redução drástica do risco de atraso na escrituração do LMC.\nAgilidade Operacional: Elimina a necessidade de o operador retornar à tela do LMC apenas para clicar em \"Gravar\" após ter feito todo o trabalho no CRC", "atrasado": "false"}, {"nome": "[TRAPEZIO] Bico 00 - Alphaville Bico 00 - Alphaville - 202607001870", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Origem: Suporte\nSolici​tante: TRAPÉZIO\nTipo: Erro\nContexto: A concentradora HORUSTECH, utilizada em filiais do Grupo Trapézio, eventualmente envia registros de abastecimento referenciando um número lógico de bico (\"00\") que não existe no cadastro do KingPosto. Esse padrão já foi identificado em pelo menos 3 filiais diferentes (Beira Rio, Linha Verde 016, e agora Alphaville).\nProblema identificado: No chamado 202607001866 (Beira Rio), o erro foi reproduzido e confirmado no log — Erro durante a sincronização de suprimentos: Falha na inclusao do abastecimento: Nao encontrado o bico ativo com o numero logico 00 para a concentradora 001 - HORUSTECH — travando a fila de sincronização por completo até correção manual via API (ignoreOneOfSync). No chamado 202607001870 (Alphaville), o cliente relatou o mesmo sintoma (print idêntico ao do 1866), porém, ao consultar os logs, não foi possível localizar essa ocorrência ativa no momento da análise.\nImpacto: Quando ocorre, trava a fila de sincronização inteira, impedindo o processamento de qualquer abastecimento (pista parada) até intervenção manual da equipe de suporte. Sempre com a mesma causa aparente do lado da concentradora.\nUrgência: Alta — é um padrão reincidente que gera parada de pista e consome retrabalho repetido de suporte.\nAnexos / evidências:\nChamado 202607001866 (Beira Rio) — log completo com o erro reproduzido e o procedimento de correção aplicado (ignoreOneOfSync).\nChamado 202607001870 (Alphaville) — print do cliente com o mesmo sintoma relatado.", "atrasado": "false"}, {"nome": "[Trapezio] Controle de reimpressão de comprovantes TEF Solicitação de melhoria – Controle de reimpressão de comprovantes TEF", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "202607001571\nControle de reimpressão de comprovantes TEF Solicitação de melhoria – Controle de reimpressão de comprovantes TEFDescrição padrão\nO cliente solicita uma evolução no controle de impressão dos comprovantes de transações TEF (pagamentos digitais), especificamente para as vias do cliente e do estabelecimento.\nOrigem:\nSuporte\nSolicitante:\nDecio\nTipo:\nSuporte\nContexto:\nCenário Atual: O sistema permite a impressão ilimitada dos comprovantes originais sem qualquer restrição ou diferenciação entre a primeira impressão e as posteriores. Isso gera um ponto de vulnerabilidade sob a ótica de auditoria e controle operacional.\nCenário Proposto: 1. Permitir a impressão da via original apenas uma única vez no momento da conclusão da transação.\n2. Caso haja necessidade de uma nova impressão posterior, o comprovante deve conter explicitamente o termo \"REIMPRESSÃO\".\n3. Exigir autorização de um supervisor ou usuário com perfil de alçada apropriado para liberar a reimpressão.Benefícios Esperados\nMaior controle sobre os comprovantes TEF emitidos.\nRedução de riscos de uso indevido ou duplicidade documental.\nMelhor rastreabilidade para auditoria e conferência operacional.\nUrgência:\nMelhoria | Baixa\nAnexos / evidências:\nTicket e evidencias em anexo\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "[TRAPEZIO] Criar parametro para mostrar|ou não relatorio de caixa", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "202606001374\nRetirar Acesso Para Consulta de Relatório Prévio do Caixa\nDescrição padrão\nOrigem:\nSuporte\nSolicitante:\nTrapezio - Erich\nTipo:\nMelhoria\nContexto:\nEles solicitaram um parâmetro para inibir/ocultar a pré-visualização DE FECHAMENTO do caixa, que indica se haverá sobras/faltas.\nProblema identificado:\nEstão tendo casos onde o operador usa ele antes de encerrar o turno para ficar com a sobra.\nImpacto:\nOs operadores estão ficando com as sobras.\nUrgência:\nFoi solicitado urgência pois os operadores estão ficando com a sobra\nAnexos / evidências:\nVideo em anexo.\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "[TRAPEZIO] Erro ao selecionar orçamento", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "Erro ao selecionar orçamento\nSegue evidencias\nhttps://drive.google.com/drive/folders/1yamZqqNM4YVGt39potwpsY3t4tBp1X6E?usp=drive_link", "atrasado": "false"}, {"nome": "[TRAPEZIO] Informação da transação errada no fechamento de caixa", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Desenvolvimento de Projeto;Suporte", "notas": "Pelo que entendi, o cliente quer que o nome \"em contingência\", que aparece na conferência de caixa, seja substituído por algo como \"nota rejeitada verificar pendência no pdv\". No caso do chamado, a nota foi emitida em contingência, mas, por erro no campo IE do cliente, ela foi rejeitada. Porém, na conferência de caixa, aparece apenas \"em contingência\", sem especificar a rejeição, para que o usuário entenda e corrija. Seria essa a melhoria.", "atrasado": "false"}, {"nome": "[TRAPEZIO] Não aparece opção de cartão qualidade posto TS", "categoria": "Aguardando Validação", "status": "Em andamento", "prioridade": "Importante", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "2026-06-16", "rotulos": "Erro;Suporte", "notas": "Foi relatado pelo cliente que depois da atualização do PDV o cartão \"Qualidade\" não apareceu como opção.\nRelato:\n\"Bom dia, posto TS não está aparecendo a opção de pagamento com cartão qualidade.\nO sistema foi atualizado ontem e ajustado o parâmetro no arquivo do Clisitef, ajustado com o 3305\nSegue em anexo foto dos arquivos, apenas no PDV 01 e 02, ambos da loja, da pista, segundo a operação está normal.\n\"\nEm anexo, as evidencias", "atrasado": "true"}, {"nome": "[TRAPEZIO] Obrigatoriedade de troca de senha no pdv", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Desenvolvimento de Projeto;Suporte", "notas": "Não obrigar a troca de senha no primeiro login de um usuário tem nos causado um problema que o usuário A loga com o login do usuário B pois a senha padrão é 123456. Inclusive fizeram um teste com o usuário admin e abriram o caixa com ele.", "atrasado": "false"}, {"nome": "[TRAPEZIO] Problema de integração sangria", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Igor Ribeiro dos Santos;Felipe de Sousa Costa Silva;Danilo Oliveira Brito", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "2026-06-16", "data_conclusao": "2026-06-30", "rotulos": "Erro;Suporte", "notas": "202605001052\nFoi relatado pelos clientes que está tendo ocorrencia de sangrias que constam no King mas não no Protheus.\nAo analisar identificamos que as sangrias foram feitas na mesma hora tendo diferença apenas nos segundos, sendo assim levando apenas 1 para o protheus.", "atrasado": "true"}, {"nome": "[TRAPEZIO] Sangria é lançado em Caixa Central - deve ser lançada no Cofre", "categoria": "Em Análise", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000137\nSangria é lançado em Caixa Central - deve ser lançada nos Caixa Cofre", "atrasado": "false"}, {"nome": "[TRAPEZIO] Solicitação de Emissão de NFS-e para Cliente Padrão", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Leonardo José Pereira de Ávila;Danilo Oliveira Brito;Lucas  de Jesus Oliveira", "criado_por": "Pedro Henrique Moraes de Sousa Machado", "data_inicio": "2026-05-18", "data_conclusao": "2026-07-31", "rotulos": "Melhoria;Desenvolvimento de Projeto;Suporte", "notas": "Movdesk: 202603000253\nBoa tarde.\nO cliente Trapézio solicitou a possibilidade de emissão de Nota Fiscal de Serviço (NFS-e) para cliente padrão no ambiente nacional, considerando que novas filiais que serão implantadas também realizarão emissões de NFS-e.\nSegue abaixo a solicitação encaminhada pelo cliente:\n“Boa tarde, tudo bem?\nSobre a nota de serviço sem cliente identificado, temos algum retorno?\nRealizamos a emissão via Protheus e a nota foi autorizada no Portal Nacional. Caso necessário, podemos agendar uma call para troca de informações sobre o assunto.\nReforçamos que precisamos resolver essa questão o quanto antes, pois atualmente estamos realizando vendas sem emissão de nota fiscal e teremos outra filial com emissão de NFS-e entrando em operação, sendo necessário regularizar esse processo.”", "atrasado": "false"}, {"nome": "[TRAPEZIO] Verificar viabilidade de bloquear venda de produtos sem estoque no PDV (estoque online)", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Suporte", "notas": "202603000156\nNecessito que o estoque seja validado dentro do PDV", "atrasado": "false"}, {"nome": "[TRAPEZIO]VENDA PARA CONVENIADOS", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "202605000945\nMensagem da cliente:\nEstamos para virar um posto que possui um cliente com diferenciado, onde a empresa no seu cadastro possui conveniados.\nHoje a venda no PDV sai com o CPF do conveniado ( o mesmo não possui cadastro no autosystem, é vinculado no cadastro da empresa) e ao fazer o faturamento sai a fatura e o boleto em nome da empresa.\nComo fazemos isso no KIng?\nModelo do autosystem em anexo.", "atrasado": "false"}, {"nome": "[TRAPÉZIO] Diferenciação de adm financeira para transações parceladas", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Desenvolvimento de Projeto;Suporte", "notas": "A rotina de De-Para de adquirentes utiliza apenas o código retornado pelo SiTef (código de bandeira) para vincular transações às administradoras financeiras. Como esse código não diferencia crédito à vista de crédito parcelado, todas as transações de uma mesma bandeira são direcionadas para a mesma administradora, independentemente do número de parcelas. Melhoria solicitada:\nImplementar critério adicional na rotina de De-Para que considere a quantidade de parcelas como fator de direcionamento:\n— Parcelas = 1 → vincular à Administradora A (ex: Mastercard Crédito)\n— Parcelas > 1 → vincular à Administradora B (ex: Mastercard Crédito Parcelado)", "atrasado": "false"}, {"nome": "Bug de troco PIX sendo feito para o cliente porém não consta", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Igor Ribeiro dos Santos;Felipe de Sousa Costa Silva", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Movdesk: 202607001888\nBug de troco PIX sendo feito para o cliente porém não consta no cliente\nDescrição padrão:\nO TrocoPIX iria ser feito, foi limpada a venda, porém suponho que tenha permanecido em cache no King e foi feito o valor pro cliente, porém não subiu para o Protheus a informação.\nOrigem: Suporte\nSolicitante: Decio\nTipo: Problema\nImpacto:\nTrocoPIX vai para o cliente, porém não consta no sistema.\nAnexo:\nEvidências no anexo\nUrgência:\nAlta\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "BUG DE VENDA PDV MOVEL GERANDO TROCO", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Danillo Lucas Figueiredo dos Santos;Igor Ribeiro dos Santos;Felipe de Sousa Costa Silva;Danilo Oliveira Brito", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "2026-07-22", "data_conclusao": "2026-07-31", "rotulos": "Erro;Suporte", "notas": "Movdesk: 202606001446\nVenda com troco no PDV movel\nDescrição padrão:\nFoi identifica que ao selecionar um produto que tem formas de pagamento negociadas em algumas ocasiões gera troco no PDV movel.\nOrigem: Suporte\nSolicitante: Decio\nTipo: Problema\nContexto:\nExemplo:\nAo iniciar uma venda com pagamento no CD e de forma rápida alterar para Dinheiro (Dinheiro possui desconto) o valor continua com o original e a diferença entra como troco.\nImpacto:\nGera um troco indevido. Cliente havia solicitado o bloqueio de troco no PDV\nUrgência:\nAlta\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "DECIO - Problema na validação de Ticket na Cancela Sanvitron - 202606001398", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Origem: Suporte\nSolicitante: DECIO\nTipo: Erro / Ajuste de Integração.\nContexto: Integração entre o KingPosto e o sistema de controladora de cancelas Sanvitron para a validação automática de tickets de estacionamento após vendas que cumprem as regras de negócio.\nProblema identificado: Ao realizar a validação de um ticket no PDV Fixo, o sistema identifica que o ticket está correto conforme a regra, porém não realiza o envio (callback) da validação para a Sanvitron. Como resultado, ao chegar na cancela de saída, o motorista é informado de que o ticket não foi validado. O problema é generalizado para todos os tickets que se enquadram na regra.\nImpacto: Geração de gargalos e filas no pátio, necessidade de intervenção humana para aberturas manuais da cancela e perda de dados estatísticos de fluxo de veículos, afetando os indicadores do cliente.\nUrgência: Alta, devido ao impacto direto na operação de saída e satisfação dos usuários do pátio.\nAnexos / evidências: Foram anexados ao chamado prints do KingPosto e fotos dos tickets físicos (Ex: Tickets 188115 e 189111) para rastreio da transação.\nResponsável pela análise: José Abinoan", "atrasado": "false"}, {"nome": "Descontinuação da NP Express", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Igor Ribeiro dos Santos;Felipe de Sousa Costa Silva", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Ao acessar o cadastro de clientes no PDV é visivel um campo \"Nota a Prazo\" onde o mesmo ativa o NP Express. \nClientes estão ativando essa campo de forma acidental fazendo a venda passar por validações não usuais e desativadas gerando erro de processamento.\nImapcto:\nCliente reclamando que a nota esta parada com erro de processamento.", "atrasado": "false"}, {"nome": "Melhoria na Rotina Faturamento Manual V2", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Igor Ribeiro dos Santos", "criado_por": "Igor Ribeiro dos Santos", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Movdesk: 202607002034\nMelhoria na Rotina Faturamento Manual V2\nDescrição padrão\nA solicitação seria no campo Fatura, criar uma opção de gerar fatura por filial de origem\nOrigem: Suporte\nSolicitante: Decio\nTipo: Melhoria\nContexto:\n. O sistema entender que as vendas do cliente seja faturada por unidade. E se selecionarmos mais de um cliente ele permita também.\nImpacto:\nMelhoria\nUrgência:\nBaixa\nResponsável pela análise:\nIgor", "atrasado": "false"}, {"nome": "NUTRIZA - Saque Vale Motorista - 202607001928", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Suporte", "notas": "Título: Correção - Falha na rolagem da listagem na tela de Saque Vale Motorista (PDV Fixo).\nOrigem: Suporte.\nSolicitante: NUTRIZA Tipo: Erro (Bug de Interface/Layout).\nContexto: Rotina de Saque Vale Motorista \nProblema Identificado:Na versão atual do PDV Fixo, ao tentar selecionar valores ou itens na listagem da tela de Saque, a lista de opções \"transborda\" para fora da borda inferior da tela, impedindo que o operador visualize ou selecione os itens que ficam ocultos abaixo da margem do monitor.\nSugestão do Cliente: Ajustar o comportamento do componente para que a lista de seleção abra para cima (quando próximo à borda inferior) ou que a rolagem interna seja limitada à área visível da janela da aplicação.\nImpacto: Dificuldade crítica na operação de frente de caixa. \nUrgência: Média/Alta (afeta uma rotina financeira diária de balcão).\nResponsável pela Análise: José", "atrasado": "false"}, {"nome": "TRAPEZIO - PARAMATROS ou TRAVAS para não passar vendas com caixas abertos - através de dia já transcorrido - 202607001678", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "José Abinoan Araujo Almeida", "criado_por": "José Abinoan Araujo Almeida", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Suporte", "notas": "Título: Implementação de trava preventiva para caixas abertos em datas transcorridas.\nOrigem: Suporte\nTipo: Melhoria / Nova Funcionalidade.\nContexto: O parâmetro MV_XVADTCX valida a data na finalização da venda. O cliente reporta que operadores mantêm caixas abertos por dias, e a mensagem de erro só aparece após a tentativa de fechamento da venda, gerando perda de tempo operacional.\nProblema Identificado: Inexistência de uma trava na abertura da venda ou no login que impeça a operação caso o caixa tenha sido aberto em uma data retroativa à do sistema operacional.\nImpacto: Retrabalho constante dos operadores, reclamações de \"vendas voltando para a tela\" e risco de inconsistências na conferência de caixa (tabela SLW).\nUrgência: Média/Alta (devido à recorrência no cliente).\nEvidências: Prints anexados ao chamado 202607001678 mostrando o erro no SmartPOS e a planilha de horários do cliente", "atrasado": "false"}], "implantacao": [{"nome": "* [COOPEL] - CHECKOUT - ID: 56 - Melhoria na visualização do troco da venda ao finalizar.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Relato do cliente:\nAo vender em dinheiro e colocar um valor maior, o valor do troco aparece sombreado na tela de fundo e muito rápido e o no cupom impresso aparece o valor numa linha e os centavos na linha de baixo.", "atrasado": "false"}, {"nome": "* [COOPEL] - CHECKOUT - ID:79- Verificar a possibilidade de Colocar a informação do Numero/Serie do cupom no comprovante de pagamento do TEF.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Sil 05-18", "data_conclusao": "2026-06-02", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Foi reportado pela Nilda que o arquivo .txt gerado atualmente é utilizado para importação no sistema Inforlub da Vibra, responsável pela atualização dos preços dos produtos exibidos no aplicativo.\nO processo operacional funciona da seguinte forma:\nO sistema gera um arquivo .txt contendo os produtos e preços.\nA Nilda acessa o sistema da Vibra (Inforlub).\nRealiza a importação manual do arquivo.\nO sistema processa os dados e atualiza os preços no aplicativo.\nEstrutura do Arquivo\nExemplo de linha do arquivo:\nP#7898227540866#AIR TRUCK CARRO NOVO 500 ML#UN#000003500#\nEstrutura das colunasPosiçãoCampoExemploDescrição1Tipo de RegistroPIdentifica o tipo do registro2Código do Produto / Código de Barras7898227540866Código/EAN do produto3Descrição do ProdutoAIR TRUCK CARRO NOVO 500 MLDescrição do item4Unidade de MedidaUNUnidade do produto5Preço000003500Valor do produto sem separador decimal\nAtualmente o campo de preço está sendo gerado no formato numérico sem separador decimal, por exemplo:\n000003500\nEsse valor representa:\n35,00", "atrasado": "true"}, {"nome": "[CAPUL] Apontamento do Centro de Custo na venda de Consumo Próprio", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Implantação", "notas": "A Capul solicitou que precisa nas vendas de consumo proprio que o campo Centro de Custo seja apontado na Venda para que a contabilidade consiga contabilizar corretamente, preenchendo no campo D2_CCUSTO.", "atrasado": "false"}, {"nome": "[CAPUL] Condição de Pagamento não enviada no Endpoint validaPagamento", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Edgar Araújo Neto", "data_inicio": "2026-07-08", "data_conclusao": "2026-07-15", "rotulos": "Implantação", "notas": "Identificamos que, no endpoint validaPagamento, a Capul não está recebendo a informação da condição de pagamento.\nEles possuem uma tratativa específica para os casos de Conta Leite e Empregado quando a condição de pagamento é Mês Seguinte. Como essa informação não está chegando no endpoint, a regra não está sendo aplicada corretamente.\nEssa ocorrência não havia sido mapeada durante as validações realizadas anteriormente e foi identificada apenas agora durante a operação.\no Diego nos enviou como ele está recebendo hoje, no caso precisamos enviar uma \"cond_pag\" para eles.\n{   \"mensagem\": {     \"cod_loja\": 1,     \"cod_pdv\": 141,     \"dados\": {       \"matricula\": \"A05716\",       \"loja\": \"0001\",       \"total\": 551.01,       \"password\": \"1604\",       \"selectedDependent\": null,       \"pagamentos\": [         {           \"parcelas\": 1,           \"vencimento\": \"20260619\",           \"valor_primeira_parcela\": 551.01,           \"finalizadora\": \"LP\"         }       ]     }   }}\nComo devemos enviar (código da condição de pagamento):\n{ \"mensagem\": { \"cod_loja\": 1, \"cod_pdv\": 141, \"dados\": { \"matricula\": \"A05716\", \"loja\": \"0001\", \"total\": 551.01, \"password\": \"1604\", \"selectedDependent\": null, \"pagamentos\": [ { \"parcelas\": 1, \"vencimento\": \"20260619\", \"valor_primeira_parcela\": 551.01, \"finalizadora\": \"LP\", \"cond_pag\": \"001\" } ] } }}\nTratar envio da senha para ir com criptografia, da forma que está hoje a senha do cooperado está visível.", "atrasado": "true"}, {"nome": "[CAPUL] Envio de e-mails das NFs pelo domínio da Capul", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Implantação", "notas": "A Capul solicitou que os e-mails que saem com o XML e Danfe saiam para os clientes pelo seu domínio. @capul.com.br", "atrasado": "false"}, {"nome": "[CAPUL] Erro de integração de CH", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Edgar Araújo Neto;Leonardo José Pereira de Ávila", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Implantação", "notas": "Vendas em CHEQUE estão com problemas de integração no Protheus, o issuerCodeErp está vindo em branco.\nParâmetro requires_check_issuer_registration na base do cliente está TRUE, o CH está sendo validado na negociação de pagamento normal de CH, mas na negociação do crédito próprio do cliente não está, ocasionando neste problema.\nSegue vídeo exemplificado a operação. (Primeiro irei mostrar validando e depois sem validação).", "atrasado": "false"}, {"nome": "[CAPUL] Natureza financeira de titulos a prazo (Conta Corrente Capul) inexistente na base", "categoria": "Em Análise", "status": "Em andamento", "prioridade": "Importante", "atribuido": "Edgar Araújo Neto;Leonardo José Pereira de Ávila", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Implantação", "notas": "Na integração de vendas a prazo da Capul, o King está enviando no JSON da venda a tag \"financial_account\" (dentro de paymentMethods). Não consegui localizar no King de onde esse valor é puxado.\nO impacto é o seguinte: quando essa tag vem preenchida, o conteúdo dela é gravado no campo L4_NUMCART da SL4 (fonte saleDataLoad). Depois, no fonte TRETP028 (PE LJDEPSE1, linhas 184 a 189), se o tipo do título estiver no parâmetro TP_FPGCONV e o L4_NUMCART estiver preenchido, esse conteúdo é gravado direto no E1_NATUREZ. Ou seja, o que vier nessa tag vira a natureza do título, sem validação gravando uma Natureza que nem existe na SED.\nLá o parâmetro TP_NATNP está preenchido, está acontecendo só nas notas a prazo.", "atrasado": "false"}, {"nome": "[CAPUL] Vendas com acrescimo não estão saindo nos relatórios do King", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Edgar Araújo Neto", "data_inicio": "", "data_conclusao": "", "rotulos": "Implantação", "notas": "Os relatórios do King não estão considerando o acrescimo utilizado nas vendas causando problemas na comunicação do Posto com a Retaguarda.", "atrasado": "false"}, {"nome": "[CHECKOUT] - Valores mostrando incorreto na tela de cancelamento de vendas para vendas maiores que 100,00", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ao selecionar a opção de cancelamento de venda, os valores apresentados na tela não condiz com o valor real da venda.", "atrasado": "false"}, {"nome": "[CHECKOUT] - Valores mostrando incorreto na tela de reimpressão para vendas maiores que 100,00", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ao selecionar a opção de reimprimir uma venda no checkout, o valores da venda mostrado em tela não condiz com o valor real da venda. Em anexo segue o print do problema.", "atrasado": "false"}, {"nome": "[COAPIL] - CHECKOUT - Ajustar tela de lançamento de venda com limite para CHEQUE.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-07-08", "data_conclusao": "2026-07-15", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Ao utilizar o cheque como INT07, permitir o lançamento pela tela de limites também, ou fazer alguma validação que passe pelo limite da cooperativa.", "atrasado": "true"}, {"nome": "[COAPIL] - CHECKOUT - Colocar informação de consulta de limites dos clientes", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "2026-07-15", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Na opção de mostrar dados do cliente no checkout, coloca os dados de limites dos associados nessa tela também.", "atrasado": "true"}, {"nome": "[Coapil] - CHECKOUT - Fixar nome da forma INT conforme PDV Fixo.", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ajustar a forma de pagamento INT da Coapil para fixa o nome conforme é no PDV Fixo \"Coapil Credito\" pois atualmente ele está pegando a descrição do campo \"Description\" da payment-method, ficando errado. Mesmo caso da Coopel.", "atrasado": "false"}, {"nome": "[COAPIL] - CHECKOUT - ID: 02 - Integração com balança TOLEDO", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "2026-07-31", "rotulos": "Desenvolvimento de Projeto;Implantação", "no  de pagamento que estiver disponível, porém no mercado não está permitindo seguir dessa forma como foi desenvolvido no PDV Fixo do posto.", "atrasado": "false"}, {"nome": "[Coapil] - CHECKOUT - Seleção de cliente - Ajuste na Chamada da Tela de limite quando está Offline.", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-07-28", "data_conclusao": "2026-07-31", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ao selecionar um associado na Coapil, a tela de limite é mostrado para o operador consultar os dados, porém quando a API está offline essa tela não mostra para o operador, mesmo mostrando que a API está off. Precisamos ajustar pois pode dar um falso positivo para o operador, caso não mostre que a API está fora.", "atrasado": "false"}, {"nome": "[Coapil] - CHECKOUT - Seleção de forma de pagamento INT07 ficando em cache caso selecione errado.", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-07-28", "data_conclusao": "2026-07-31", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ao selecionar a forma de pagamento Credito Coapil(INT07), caso o operador selecione a forma CH indevidamente e tente voltar para selecionar a forma DP, as condições ficam mostrando como CH ainda. Em anexo segue o video do comportamento.", "atrasado": "false"}, {"nome": "[COAPIL] Ajustes referentes ao Crédito Próprio Coapil", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Edgar Araújo Neto;Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva;Danilo Oliveira Brito", "criado_por": "Pedro Henrique Moraes de Sousa Machado", "data_inicio": "2026-05-07", "data_conclusao": "2026-05-15", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "O cliente Coapil solicitou alguns ajustes na tela de limite:\nPara os tipos de convênio, não deve haver bloqueio na utilização de crédito caso o cliente esteja com saldo negativo.\nExemplo: se o associado estiver com saldo de -R$ 1.000,00, o sistema não deve impedir a utilização do crédito para compras.\nOBS: A restrição de venda com saldo negativo deve se aplicar apenas aos clientes do tipo Funcionário.\nQuando o cliente possuir saldo negativo, esse valor deve ser mascarado, de modo que os operadores não consigam visualizar o montante negativo.\nFoi solicitado para ser disponibilizada uma forma de consultar o limite do cliente antes mesmo de sua seleção, permitindo que operadores e o próprio cliente verifiquem previamente se a condição de pagamento está liberada para uso, antes mesmo de ter o risco de abastecer e no ato do pagamento a condição de pagamento desejada pelo cliente não está disponível.", "atrasado": "true"}, {"nome": "[COOPEL] - CHECKEOU - ID: 21 - Atalho de letra \"I\" na tela de pagamentos não chama o PIX, apenas abre a lista de pagamentos", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Danilo Oliveira Brito", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKEOUT - ID: 75 - Relatório de fechamento de caixa não está saindo as vezes.", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Em anexo está o erro pego no console do PDV.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKEOUT - INTERNO - Desconto de item por valor total do lançamento e não por valor unitário.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Gabriel Cardoso;Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-06-01", "data_conclusao": "2026-06-16", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "A lógica para o desconto do item no checkout está errada, o desconto está no preço unitário, o correto seria no valor total do Item.", "atrasado": "true"}, {"nome": "[Coopel] - CHECKOUT - Erro na finalização de venda com TEF", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Cliente Coopel reportou o erro em anexo na finalização da venda com o TEF, esse problema já ocorreram outras vezes, porém esperamos ocorrer novamente para saber se tinha sido um problema pontual ou se era recorrente, como ocorreu novamente precisamos tentar tratar essa situação.", "atrasado": "false"}, {"nome": "[Coopel] - CHECKOUT - Fixar nome da forma INT conforme o Fixo", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ajustar a forma de pagamento INT da Coopel para fixa o nome conforme é no PDV Fixo \"Coopel Credito\" pois atualmente ele está pegando a descrição do campo \"Description\" da payment-method, ficando errado. Em anexo segue o print e o video enviado pelo cliente.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - ID: 27 - Teclas de atalho do teclado do mercado.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Danilo Oliveira Brito", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Cliente solicita que ao utilizar a tecla “C” Conta leite, chame as opções do conta corrente. Também a possibilidade de ao selecionar a tecla “I”, chame o cartão ticke empregado.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - ID: 3 - Integração com Balança Prix", "categoria": "Em Desenvolvimento", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Danilo Oliveira Brito", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "DRIVER: https://www.toledobrasil.com/softwares-e-drivers/automacao/8217/\nMODELO: https://www.toledobrasil.com/produto/balanca-para-checkout-8217/", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - ID: 41 - Produtos sem ser de balança permitindo passar fracionado", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Wellington  Junior", "data_inicio": "2026-06-01", "data_conclusao": "2026-06-16", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Descrição\nCliente solicita que o sistema não permita que produtos comuns não permita vender fracionado no PDV. Segue print do exemplo.", "atrasado": "true"}, {"nome": "[COOPEL] - CHECKOUT - ID: 47 - Ajustar comportamento de tela de pagamentos para aplicar desconto geral na venda.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Wellington  Junior", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Atualmente a tela de pagamentos não tem a possibilidade de aplicar o desconto geral na venda. Mesmo tentando utiliza a tecla B do teclado do mercado, não funciona.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - ID: 68 - Possibilidade de finalizar orçamentos (Pré-venda) no PDV do mercado.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Na coopel tem uma necessidade de criar orçamentos para clientes que levam as mercadorias para pagar porteriormente, antes era criado um orçamento no venda assistida e quando o cliente ia pagar era finalizado esse orçamento. Agora no king precisamos colocar o pré-venda para funcionar junto com o checkout, criar uma tela de orçamentos pendentes para serem baixados também no mercado.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - INTERNO - Ajustar tela de consulta de cliente para pegar o limite da API de limites.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "É necessário implementar na tela de consulta de cliente no checkout a consulta do limite do cliente via API, atualmente está pegando da customer-credit-limite. Em anexo está o print da tela atual.", "atrasado": "false"}, {"nome": "[COOPEL] - CHECKOUT - INTERNO - Erro ao finalizar venda quando o PDV perde conexão com o servidor na autorização da venda.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-05-13", "data_conclusao": "2026-05-15", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "A coopel reportou um erro que está ocorrendo constantemente no supermercado. Ao finalizar uma venda e o PDV perder a comunicação com servidor na finalização, ocorre um erro de \"Venda Já Finalizada\" e não deixa mais seguir pra lugar algum. O PDV Fica travado. Em enexo segue o relato do cliente.", "atrasado": "true"}, {"nome": "[COOPEL] - CHECKOUT - INTERNO - Problema de sangria indevida ao ler produto cujo tem um QRCode próximo do codigo de barras.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-05-12", "data_conclusao": "2026-05-13", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Cliente reporta que ao ler um codigo de barras e existe um QRCode próximo, o sistema está lançando umas sangrias indevidamente no sistema.", "atrasado": "true"}, {"nome": "[COOPEL] - CHECKOUT - Possibilidade de colocar observações na nota fiscal direto no PDV.", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Desenvolvimento de Projeto;Implantação", "notas": "Cliente solicita criar um campo para informar dados complementares na nota fiscal emitida pelo PDV do Checkout.", "atrasado": "false"}, {"nome": "[COOPEL] - PDV FIXO - INTERNO - Problema ao utilizar nova tela de limites.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Urgente", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-06-15", "data_conclusao": "2026-06-30", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Ativamos o limite da Coopel no posto agora, mas lá está filtrando tudo que vem da API, teria como ajustar para ele considerar apenas os que tiver com INT06 igual foi feito no PDV do mercado? Em anexo segue os prints das telas.", "atrasado": "true"}, {"nome": "[COOPEL] CHECKOUT - INTERNO - Padronizar fonte e formato de letras para cupons.", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Erro;Desenvolvimento de Projeto;Implantação", "notas": "Precisamos que a impressão dos cupons tenha um padrão, pois está ocorrendo um problema no cliente Coopel que para alguns PDVs os cupons sai com algumas partes de uma forma e outros de outra forma. A equipe de TI já compararam versão de drives e estão iguais nos PDVs, porém estão saindo com fontes diferentes e ilegiveis. Segue em anexo exemplo.\nImpressora ELGIN I9 FULL", "atrasado": "false"}, {"nome": "[COOPEL] Pagamento com Cheque sem cadastro de emitente", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Danilo Oliveira Brito", "data_inicio": "2026-05-04", "data_conclusao": "2026-05-19", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "Há necessidade de que não obrigue cadastrar um emitente para a forma de pagamento cheque nos PDVs.\nNa tela deve solicitar os campos de CPF, RG, NOME e TELEFONE do emitente do cheque, sem precisar fazer o cadastro. \nConsiderar também validar o CPF digitado na API da Coopel que valida se pode ou não aceitar cheques da pessoa.", "atrasado": "true"}, {"nome": "[Cooperabaete] - CHECKOUT - ID: 09 - Possibilidade de Reimprimir sangrias e suprimentos", "categoria": "Entrada de Demandas", "status": "Não iniciado", "prioridade": "Média", "atribuido": "Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "", "data_conclusao": "", "rotulos": "Melhoria;Desenvolvimento de Projeto;Implantação", "notas": "Cliente solicita a possibilidade de reimprimir sangrias e suprimentos no PDV. Avaliar a viabilidade dessa melhoria.", "atrasado": "false"}, {"nome": "[Cooperabaete] - CHECKOUT - ID: sidade de termos uma documentação mais estruturada e abrangente sobre o processo de parametrização e funcionamento da integração com o Promoflex;\n Confirmações do alinhamento:\nCusto da API: confirmado que a Cooprata não terá custo adicional pela API.\nObservação: novas demandas fora do escopo atual seguirão novo processo e poderão gerar custo (ex.: integração de cadastro de clientes entre plataformas).\nPontos para validação pela Duoffy:\nA integração entre as soluções funciona sem impacto nas regras atuais?\nEx.: o limite de crédito que passa na API para vendas a prazo (CO,FA,BO,NP...) interfere em algo?\nAs regras de desconto/acréscimo do King não entram em conflito com o cashback?\nEx.: descontos do King e do cashback serão aplicados normalmente, sem anular um ao outro?\nHá algum ponto de atenção quanto a segurança, processamento, memória ou internet para a integração com a API deles?\nResumo de funcionalidades da plataforma deles e a API seguem abaixo\n    Desde já agradeço a atenção e caso alguém queira pontuar algum detalhe fique a vontade. Ficamos no aguardo da análise dos pontos citados acima, para seguirmos internamente a definição.\nAPI do sistema deles para análise/validação e breve descritivo de funcionalidades para conhecimento:\n1. Segue link com api do promoflex consumida pelo sistema king posto > https://app.swaggerhub.com/apis-docs/Grupo-Impulse/promoflex-api/2.0\n2. Segue em anexo nosso contrato de fornecimento de software.\n3. Funcionalidades:\n- Em anexo portfólio do produto\n- Aplicativo customizado com a marca do posto para ios e android.\n- Crm online para gestão do aplicativo\n- Api integradora com o sistema para aplicação do benefício direto na venda\n- sincronia automática de cadastro de produto\n- sincronia de vendas para análise e acompanhamento\n- campo para inclusão de termos de uso e privacidade na area de cadastro\n- Base de clientes própria hospedada em nuvem da aws.\n- Desconto aplicado no PDV, criação de regras de Pontuação e Cashback sobre a venda, Resgate de prêmios mediante troca de pontos ou meta de compras por valor ou quantidade\n- Controle antifraude com monitoramento das vendas, Dashboard e relatórios para visualização e exportação de informações,\n- Mensagens de texto via aplicativo e área na home para inclusão de banners\n- Sorteio digital.\n- Segmentação de campanhas por:\n( Categoria de clientes, cliente compra e muda de nível mediante meta pré estabelecida podendo ter mais benefícios por nível.)\n( Classe de cliente, cliente pode ter seu cadastro vinculado a uma classe para obter um benefício exclusivo criado para aquela classe.)\n( Aniversariantes, promoções para o cliente que está fazendo aniversário.)\n( Gênero, promoção por gênero do cliente.)\n( Faixa da semana, promoção por dia e horário da semana.)\n( Inativos, promoção para clientes que estão sem comprar a x dias)\n( Cuponeria, cupons de desconto para criar campanhas e aumentar a vendas)\n4.\nGestão de regras de bônus e expiração: ( Regras de benefício de cashback e pontuação tem parâmetro para informar a data de expiração/vencimento.)\nCadastro e segmentação de clientes: ( o cadastro do cliente pode ser feito por ele mesmo via aplicativo, pelo posto via crm de forma manual ou importação de planilha )\nAdministração de parceiros: ( Os parceiros são cadastrados no crm, e é disponibilizado o app de resgate para ser instalado em um desktop windows no parceiro para validação do resgate e controle de qual benefício está sendo resgatado naquela loja, com visão no crm do histórico e possibilidade de gerar relatório\nConferências e manutenções operacionais: ( A operação e uso da ferramenta fica a cargo do cliente, pois será feito um fluxo de implantação e treinamento e posteriormente disponibilizado o canal de suporte )\nO nível de automação disponível na plataforma: ( Todo os processos de criação de benefício da plataforma são automatizado, mas para isso é necessário que o cliente crie as regras e ative)\nPossibilidades de per go para pagar o boleto e quando ela colocar os código da como erro\"", "atrasado": "false"}, {"nome": "[JBRETAS] - Relatório de fechamento de caixa na pista. Necessidade: Permitir a reimpressão em outro período para conferência do gerente", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Pedro Henrique Moraes de Sousa Machado;Edgar Araújo Neto;Felipe de Sousa Costa Silva", "criado_por": "Leonardo José Pereira de Ávila", "data_inicio": "2026-05-04", "data_conclusao": "2026-05-19", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "", "atrasado": "true"}, {"nome": "[JBRETAS] - Relatório de vendas usado na pista precisa aparecer o nome do produto completo", "categoria": "Aguardando Validação", "status": "Não iniciado", "prioridade": "Baixa", "atribuido": "Edgar Araújo Neto;Pedro Pereira Pinto Neto;Felipe de Sousa Costa Silva", "criado_por": "Leonardo José Pereira de Ávila", "data_inicio": "2026-05-04", "data_conclusao": "2026-05-19", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "", "atrasado": "true"}, {"nome": "[MIRIAM][CONCILIADOR EQUALS] Integração com Conciliador Equals para vendas com Cartões CC/CD", "categoria": "Em Backlog", "status": "Em andamento", "prioridade": "Média", "atribuido": "Leonardo José Pereira de Ávila", "criado_por": "Danilo Oliveira Brito", "data_inicio": "2026-04-13", "data_conclusao": "2026-06-30", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "", "atrasado": "true"}, {"nome": "[MODELO DE PREENCHIMENTO]", "categoria": "Aguardando Informações", "status": "Não iniciado", "prioridade": "Média", "atribuido": "", "criado_por": "Danilo Oliveira Brito", "data_inicio": "", "data_conclusao": "", "rotulos": "", "notas": "Título\nNome curto e objetivo da demanda.Descrição padrão\nOrigem:\nImplantação / Suporte / Produto / outra área\nSolicitante:\nNome da pessoa ou área\nTipo:\nErro / melhoria / funcionalidade / ajuste\nContexto:\nResumo da situação atual\nProblema identificado:\nO que está acontecendo hoje\nImpacto:\nQual o prejuízo, retrabalho ou risco gerado\nUrgência:\nPor que precisa de atenção\nAnexos / evidências:\nPrints, vídeos, documentos, exemplos (Se tiver errorlog anexar a errorlog completa em arquivo de texto, orientar sempre ao usuário que salve a errorlog ou reproduza o erro até gerar a errorlog)\nResponsável pela análise:\nNome do responsável", "atrasado": "false"}, {"nome": "[NICOLLETTI] - Ajustar integração com a EZTech para trabalhar com níveis de preços dos bicos - Entender o Processo", "categoria": "Em Backlog", "status": "Não iniciado", "prioridade": "Importante", "atribuido": "Leonardo José Pereira de Ávila;Felipe de Sousa Costa Silva", "criado_por": "Felipe de Sousa Costa Silva", "data_inicio": "2026-06-01", "data_conclusao": "2026-06-16", "rotulos": "Desenvolvimento de Projeto;Implantação", "notas": "GO LIVE 01/06\nSegue levantamento feito no sistema WebPosto referente a troca de preços\nPrimeiramente é feito um cadastro prévio na retaguarda, abaixo segue documentação da rotina deles:\nhttps://qualityautomacao.atlassian.net/wiki/spaces/webPosto/pages/5407748/Troca+de+Pre+o+via+Cart+o\n1. O WebPosto pergunta se há um cartão na bomba\nA cada poucos segundos, o sistema executa a função de checagem. No log, o WebPosto envia um comando bruto para a Horustech perguntando se algum cartão mestre foi passado para autorizar preços:\nComando no Log: lerCartaoTrocaPreco seguido do envio de dados brutos Envio ->>?00020C74.\nEnquanto ninguém passa o cartão na pista, a Horustech responde com um código padrão dizendo que não há novidades Retorno <->!00020C56.\n2. O cartão é passado fisicamente na bomba\nQuando o gerente aproxima o chaveiro/cartão RFID no leitor do bico na pista, a Horustech captura o ID desse cartão. No ciclo seguinte de pergunta do WebPosto, a concentradora finalmente responde entregando os dados capturados:\nO que aparece no Log: Cartao:B328090977D238A5 Sensor:01.\n3. O WebPosto calcula e en const PRIO_ORDER = {'Urgente':4,'Importante':3,'Média':2,'Baixa':1,'':0};
const PRIO_COLOR = {'Urgente':'var(--urgente)','Importante':'var(--importante)','Média':'var(--media)','Baixa':'var(--baixa)','':'var(--line)'};
const PRIO_FILL = {'Urgente':'100%','Importante':'72%','Média':'45%','Baixa':'20%','':'8%'};

let state = { tab:'suporte', search:'', prioridade:'', categoria:'', responsavel:'' };

function extractClient(nome){
  const m = nome.match(/^\s*\[([^\]]+)\]/);
  return m ? m[1].trim() : null;
}

function escapeHtml(s){
  return (s||'').toString().replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderCard(item, idx){
  const client = extractClient(item.nome);
  const titleHtml = client
    ? item.nome.replace(/^(\s*\[[^\]]+\])/, '<span class="tag">$1</span>')
    : escapeHtml(item.nome);

  const catBadges = (item.rotulos||'').split(';').filter(Boolean).map(r=>{
    const cls = r.trim()==='Suporte' ? 'cat-suporte' : (r.trim()==='Implantação' ? 'cat-implantacao' : '');
    return `<span class="badge ${cls}">${escapeHtml(r.trim())}</span>`;
  }).join('');

  const statusCls = item.status === 'Em andamento' ? 'andamento' : '';
  const notes = item.notas ? escapeHtml(item.notas) : '';
  const hasNotes = !!item.notas;

  return `
  <div class="card">
    <div class="gauge-wrap">
      <div class="gauge"><div class="fill" style="height:${PRIO_FILL[item.prioridade]||'8%'}; background:${PRIO_COLOR[item.prioridade]||'var(--line)'}"></div></div>
      <div class="gauge-label">${escapeHtml(item.prioridade||'—')}</div>
    </div>
    <div class="card-main">
      <p class="title">${titleHtml}</p>
      <div class="meta-row">
        ${catBadges}
        <span class="badge status ${statusCls}">${escapeHtml(item.status)}</span>
        ${item.categoria ? `<span class="m-item">${escapeHtml(item.categoria)}</span>` : ''}
        ${item.data_inicio && item.data_inicio!=='' ? `<span class="m-item">Início: ${escapeHtml(item.data_inicio)}</span>` : ''}
      </div>
      ${hasNotes ? `<button class="notes-toggle" onclick="toggleNotes(this)">Ver notas</button><div class="notes-body">${notes}</div>` : ''}
    </div>
    <div class="side-col">
      <div class="assignee"><span class="lbl">Atribuído</span>${escapeHtml(item.atribuido || '—')}</div>
    </div>
  </div>`;
}

function toggleNotes(btn){
  const body = btn.nextElementSibling;
  body.classList.toggle('open');
  btn.textContent = body.classList.contains('open') ? 'Ocultar notas' : 'Ver notas';
}

function splitNames(s){
  return (s||'').split(';').map(x=>x.trim()).filter(Boolean);
}

function applyFilters(list){
  return list.filter(item=>{
    if(state.prioridade && item.prioridade !== state.prioridade) return false;
    if(state.categoria && item.categoria !== state.categoria) return false;
    if(state.responsavel && !splitNames(item.criado_por).includes(state.responsavel)) return false;
    if(state.search){
      const s = state.search.toLowerCase();
      const hay = (item.nome+' '+item.atribuido+' '+item.categoria).toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}

function render(){
  const list = applyFilters(DATA[state.tab]);
  const container = document.getElementById('listContainer');

  if(list.length===0){
    container.innerHTML = '<div class="empty-state">Nenhum item encontrado com esses filtros.</div>';
    return;
  }

  // group by leading client tag to keep sequence together, visually
  let html = '';
  let lastGroup = null;
  list.forEach(item=>{
    const client = extractClient(item.nome) || 'Sem cliente identificado';
    if(client !== lastGroup){
      html += `<div class="group-head">${escapeHtml(client)} <span class="count">(${list.filter(i=>(extractClient(i.nome)||'Sem cliente identificado')===client).length})</span></div>`;
      lastGroup = client;
    }
    html += renderCard(item);
  });
  container.innerHTML = html;
}

function updateCounts(){
  document.getElementById('cnt-suporte').textContent = DATA.suporte.length;
  document.getElementById('cnt-implantacao').textContent = DATA.implantacao.length;
  document.getElementById('totalAll').textContent = DATA.suporte.length + DATA.implantacao.length;
  const all = [...DATA.suporte, ...DATA.implantacao];
  document.getElementById('totalUrgente').textContent = all.filter(i=>i.prioridade==='Urgente').length;
  document.getElementById('totalAndamento').textContent = all.filter(i=>i.status==='Em andamento').length;
}

function populateResponsavelFilter(){
  const all = [...DATA.suporte, ...DATA.implantacao];
  const names = new Set();
  all.forEach(i => splitNames(i.criado_por).forEach(n => names.add(n)));
  const sorted = [...names].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const sel = document.getElementById('responsavelFilter');
  sorted.forEach(n=>{
    const opt = document.createElement('option');
    opt.value = n;
    opt.textContent = n;
    sel.appendChild(opt);
  });
}

function populateCategoriaFilter(){
  const all = [...DATA.suporte, ...DATA.implantacao];
  const cats = new Set();
  all.forEach(i => { if(i.categoria) cats.add(i.categoria); });
  const sorted = [...cats].sort((a,b)=>a.localeCompare(b,'pt-BR'));
  const sel = document.getElementById('categoriaFilter');
  sorted.forEach(c=>{
    const opt = document.createElement('option');
    opt.value = c;
    opt.textContent = c;
    sel.appendChild(opt);
  });
}

document.querySelectorAll('.tab-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.tab-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    state.tab = btn.dataset.tab;
    render();
  });
});

document.getElementById('searchInput').addEventListener('input', e=>{
  state.search = e.target.value;
  render();
});
document.getElementById('prioridadeFilter').addEventListener('change', e=>{
  state.prioridade = e.target.value;
  render();
});
document.getElementById('categoriaFilter').addEventListener('change', e=>{
  state.categoria = e.target.value;
  render();
});
document.getElementById('responsavelFilter').addEventListener('change', e=>{
  state.responsavel = e.target.value;
  render();
});

updateCounts();
populateResponsavelFilter();
populateCategoriaFilter();
render();
</script>
</body>
